# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. CI installs Rust with
# dtolnay/rust-toolchain; it is not pinned here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]
# CI installs only the tools a job needs; `mise run` must not install the rest behind its back. ~keep
task.run_auto_install = false

[tools]
"github:Goldziher/poly" = "0.32.2"
"github:Goldziher/adrlint" = "0.4.1"
node = "26.13.0"
bun = "1.3"
pnpm = "12.16.1"
actionlint = "1.7.12"
"github:Goldziher/gh-actions-updater" = "0.4.0"
hyperfine = "1.20.0"

[tasks.setup]
description = "Install all dependencies and the git hooks. Idempotent."
run = ["mise install", "cargo fetch", { task = "governance:hooks:install" }]

[tasks.build]
description = "Build the skif binary"
run = "cargo build --workspace --release --locked"

[tasks.lint]
description = "Clippy (deny warnings) plus poly's lint over the repo"
run = ["cargo clippy --workspace --all-targets --locked -- -D warnings", "poly lint ."]

[tasks.format]
description = "Format Rust with rustfmt and the rest of the tree with poly"
alias = ["fmt"]
run = ["cargo fmt --all", "poly fmt --fix ."]

[tasks."format:check"]
description = "Verify formatting without writing changes"
alias = ["fmt:check"]
run = ["cargo fmt --all -- --check", "poly fmt --check ."]

[tasks.bench]
description = "Build skif in release mode and benchmark it with hyperfine (needs hyperfine; sherif, syncpack and knip are used when installed)"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- run --skif target/release/skif",
]

[tasks."bench:micro"]
description = "Run the criterion micro-benchmarks"
run = "cargo bench --workspace --locked"

[tasks."bench:generate"]
description = "Generate a synthetic monorepo: mise run bench:generate -- --packages 500 --out target/bench-generated/demo"
run = "cargo run --release --locked -p skif-bench -- generate"

[tasks."bench:corpus"]
description = "Fetch the pinned benchmark corpus into target/bench-corpus"
run = "cargo run --release --locked -p skif-bench -- corpus fetch"

[tasks."docs:dev"]
description = "Serve the documentation site locally (installs website dependencies first)"
dir = "website"
run = ["pnpm install", "pnpm run dev"]

[tasks."docs:build"]
description = "Build the documentation site into website/dist"
dir = "website"
run = ["pnpm install --frozen-lockfile", "pnpm run build"]

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace --locked --no-fail-fast"

[tasks."test:verbose"]
description = "Run all tests with output shown"
run = "cargo test --workspace --locked --no-fail-fast -- --nocapture"

[tasks.e2e]
description = "Build skif and run the end-to-end tests against one real package manager (npm, pnpm, yarn or bun)"
usage = 'arg "<package-manager>" help="Package manager to test against" { choices "npm" "pnpm" "yarn" "bun" }'
run = 'cargo build --locked && scripts/e2e/run.sh "$usage_package_manager" target/debug/skif'

[tasks.deny]
description = "Check advisories, licenses, bans and sources (cargo-deny comes from the environment or the CI action)"
run = "cargo deny check"

[tasks."adr:lint"]
description = "Lint the architecture decision records"
run = ["adrlint lint adrs", "adrlint format --check adrs", "adrlint lock --check"]

[tasks."oxc:lockstep"]
description = "Build skif with js-analysis against the git commit of the matching oxc release tag (ADR 0021); pass a tag to try another release"
run = "scripts/check-oxc-git-patch.sh"

[tasks."schema:check"]
description = "Fail when schema/skif.schema.json differs from the schema `skif schema` prints"
run = "scripts/check-schema.sh"

[tasks."consistency"]
description = "Check version surfaces, exact oxc pins, workspace-inherited dependencies, vendored headers, rule ids, plugin lists and crate notices"
run = [
  "scripts/check-versions.sh",
  "scripts/check-pins.sh",
  "scripts/check-headers.sh",
  "scripts/check-rule-ids.sh",
  "scripts/check-plugin-list.sh",
  "scripts/check-dependency-tree.sh",
  "scripts/check-package-contents.sh",
]

[tasks."ai:validate"]
description = "Validate the ai-rulez configuration, lock and generated outputs"
run = [
  "npx -y ai-rulez@latest validate --strict --no-local",
  "npx -y ai-rulez@latest lock --check",
  "npx -y ai-rulez@latest generate --no-local --strict-config --check",
]

[tasks."docs:rust"]
description = "Build the rustdoc of the workspace with warnings denied (the CI Documentation job)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --all-features --locked"

[tasks.features]
description = "Check the facade with each feature on its own (the CI feature matrix)"
run = '''
set -e
for features in "" manifest policy js-analysis fix yaml-fix report schema; do
  echo "skif features: ${features:-<none>}"
  cargo check -p skif --locked --no-default-features --features "$features"
done
'''

[tasks.check]
description = "Full local gate: what CI enforces except deny (needs cargo-deny) and the MSRV build"
run = [
  { task = "format:check" },
  { task = "lint" },
  { task = "test" },
  { task = "schema:check" },
  { task = "consistency" },
  { task = "docs:rust" },
  { task = "features" },
]

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.update]
description = "Update dependencies (compatible versions only, no manifest edits)"
run = "cargo update"

[tasks.upgrade]
description = "Upgrade dependencies to latest, including incompatible bumps (rewrites manifests)"
run = ["cargo upgrade --incompatible", "cargo update"]

[tasks."governance:generate"]
description = "Generate native AI governance outputs"
run = "npx -y ai-rulez@latest generate --no-local --strict-config"

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]
