# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. CI installs Rust with
# dtolnay/rust-toolchain; it is not pinned here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]
# CI installs only the tools a job needs; `mise run` must not install the rest behind its back. ~keep
task.run_auto_install = false

[tools]
"github:polylint/polylint" = "0.34.2"
# ~keep xberg-io reusable-validate installs adrlint as github:Goldziher/adrlint; keep the name until it moves.
"github:Goldziher/adrlint" = "0.5.0"
node = "26.13.0"
bun = "1.3"
pnpm = "12.18.0"
actionlint = "1.7.12"
"github:Goldziher/gh-actions-updater" = "0.4.0"
hyperfine = "1.20.0"
"github:mstange/samply" = "samply-v0.13.1"

[tasks.setup]
description = "Install all dependencies and the git hooks. Idempotent."
run = ["mise install", "cargo fetch", { task = "governance:hooks:install" }]

[tasks.build]
description = "Build the skif binary"
run = "cargo build --workspace --release --locked"

[tasks.lint]
description = "Clippy (deny warnings) plus poly's lint over the repo"
run = ["cargo clippy --workspace --all-targets --locked -- -D warnings", "poly lint ."]

[tasks.format]
description = "Format Rust with rustfmt and the rest of the tree with poly"
alias = ["fmt"]
run = ["cargo fmt --all", "poly fmt --fix ."]

[tasks."format:check"]
description = "Verify formatting without writing changes"
alias = ["fmt:check"]
run = ["cargo fmt --all -- --check", "poly fmt ."]

[tasks.bench]
description = "Build skif in release mode and benchmark it with hyperfine against the sherif, syncpack and knip pinned in tools/bench/corpus.toml (needs hyperfine and npm)"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- run --skif target/release/skif",
]

[tasks."cache:diff"]
description = "Build skif in release mode and compare its JSON output without the cache, cold, warm and after seeded edits on the bench corpus; fails on any difference"
usage = '''
flag "--only <names>" help="Comma-separated bench repositories"
flag "--edits <count>" help="Seeded source edits per repository (default 5)"
flag "--control <how>" help="flags (default) or env: turn the cache on and off with SKIF_CACHE and SKIF_CACHE_DIR"
flag "--require-counters" help="Fail when the warm run's report counts no cache hits"
'''
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- cache-diff --skif target/release/skif ${usage_only:+--only \"$usage_only\"} ${usage_edits:+--edits \"$usage_edits\"} ${usage_control:+--control \"$usage_control\"} $([ \"${usage_require_counters:-}\" = true ] && echo --require-counters)",
]

[tasks."bench:local"]
description = "Run the bench task the way CI does: install the corpus and tools (--install) and do not exit on the ADR targets (--no-enforce). Local numbers are not publishable"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- run --skif target/release/skif --install --no-enforce",
]

[tasks."bench:tools:update"]
description = "Update the pinned benchmark tools (sherif, syncpack, knip) in tools/bench/corpus.toml"
run = "cargo run --release --locked -p skif-bench -- tools update"

[tasks."bench:tools:check"]
description = "Check that the pinned benchmark tools in tools/bench/corpus.toml are current"
run = "cargo run --release --locked -p skif-bench -- tools check"

[tasks.profile]
description = "Profile one skif run with samply and SKIF_TIMINGS: mise run profile -- <repo-dir> [skif args...]; writes reports/profile-<name>-<timestamp>.json.gz and reports/timings-<name>-<timestamp>.txt"
run = "bash scripts/profile.sh"

[tasks."bench:micro"]
description = "Run the criterion micro-benchmarks"
run = "cargo bench --workspace --locked"

[tasks."bench:generate"]
description = "Generate a synthetic monorepo: mise run bench:generate -- --packages 500 --out target/bench-generated/demo"
run = "cargo run --release --locked -p skif-bench -- generate"

[tasks."bench:corpus"]
description = "Fetch the pinned benchmark corpus (the timed repositories) into target/bench-corpus"
run = "cargo run --release --locked -p skif-bench -- corpus fetch --suite bench"

[tasks."bench:import"]
description = "Import a run of the bench workflow into tools/bench/results and refresh the speed tables of the benchmarks page and the speed claims of the comparison guide and the README: mise run bench:import -- <run-id> (needs gh, git, jq and Node)"
run = "bash scripts/bench-import.sh"

[tasks."parity:publish"]
description = "Refresh the knip agreement table of the benchmarks page from tools/bench/baselines/parity.json"
run = "node tools/bench/refresh-numbers.mjs --parity"

[tasks.parity]
description = "Compare skif's findings with the pinned knip on the corpus: mise run parity -- [--install] [--only jest] [--check | --write-baseline]"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- parity --skif target/release/skif",
]

[tasks."diff:syncpack"]
description = "Compare skif's policy findings with the pinned syncpack on the policy fixtures and the corpus: mise run diff:syncpack -- [--check | --write-baseline]"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- syncpack-diff --skif target/release/skif",
]

[tasks."bench:deadcode"]
description = "Dead-code precision and recall of skif (and the pinned knip with --knip), against a generated answer key: mise run bench:deadcode -- [--packages 5] [--seed 1] [--knip] [--json]"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- deadcode --skif target/release/skif",
]

[tasks."corpus:fetch"]
description = "Fetch the pinned parity corpus into target/bench-corpus (add --suite bench for the timed repositories)"
run = "cargo run --release --locked -p skif-bench -- corpus fetch"

[tasks."corpus:check"]
description = "Check parity and the syncpack diff against the committed baselines (what the scheduled corpus workflow runs; needs network, Node and the package managers)"
run = [
  "cargo build --release --locked -p skif-cli",
  "cargo run --release --locked -p skif-bench -- parity --skif target/release/skif --install --check",
  "cargo run --release --locked -p skif-bench -- syncpack-diff --skif target/release/skif --check",
]

[tasks."docs:dev"]
description = "Serve the documentation site locally (installs website dependencies first)"
dir = "website"
run = ["pnpm install", "pnpm run dev"]

[tasks."docs:build"]
description = "Build the documentation site into website/dist"
dir = "website"
run = ["pnpm install --frozen-lockfile", "pnpm run build"]

[tasks."assets:render"]
description = "Render the PNG brand assets from their SVG sources (needs rsvg-convert)"
run = "scripts/render-assets.sh"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace --locked --no-fail-fast"

[tasks."test:verbose"]
description = "Run all tests with output shown"
run = "cargo test --workspace --locked --no-fail-fast -- --nocapture"

[tasks.e2e]
description = "Build skif and run the end-to-end tests against one real package manager"
usage = 'arg "<package-manager>" help="Package manager to test against" { choices "npm" "pnpm" "yarn" "yarn-classic" "bun" }'
run = 'cargo build --locked && scripts/e2e/run.sh "$usage_package_manager" target/debug/skif'

[tasks.deny]
description = "Check advisories, licenses, bans and sources (cargo-deny comes from the environment or the CI action)"
run = "cargo deny check"

[tasks."adr:lint"]
description = "Lint the architecture decision records"
run = ["adrlint lint adrs", "adrlint format --check adrs", "adrlint lock --check"]

[tasks."oxc:lockstep"]
description = "Build skif with js-analysis against the git commit of the matching oxc release tag (ADR 0007); pass a tag to try another release"
run = "scripts/check-oxc-git-patch.sh"

[tasks."schema:check"]
description = "Fail when schema/skif.schema.json differs from the schema `skif schema` prints"
run = "scripts/check-schema.sh"

[tasks."consistency"]
description = "Check version surfaces, documentation pins, exact oxc pins, workspace-inherited dependencies, vendored headers, rule ids, plugin lists, the support matrix and crate notices"
run = [
  "scripts/check-versions.sh",
  "scripts/check-doc-pins.sh",
  "scripts/check-tool-version-docs.sh",
  "scripts/check-baseline-tool-versions.sh",
  "scripts/check-pins.sh",
  "scripts/check-headers.sh",
  "scripts/check-rule-ids.sh",
  "scripts/check-plugin-list.sh",
  "scripts/check-support-matrix.sh",
  "scripts/check-dependency-tree.sh",
  "scripts/check-package-contents.sh",
]

[tasks."ai:validate"]
description = "Validate the ai-rulez configuration, lock and generated outputs"
run = [
  "npx -y ai-rulez@latest validate --strict --no-local",
  "npx -y ai-rulez@latest lock --check",
  "npx -y ai-rulez@latest generate --no-local --strict-config --check",
]

[tasks."docs:rust"]
description = "Build the rustdoc of the workspace with warnings denied (the CI Documentation job)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --all-features --locked"

[tasks.features]
description = "Check the facade with each feature on its own (the CI feature matrix)"
run = '''
set -e
for features in "" manifest js-analysis fix yaml-fix report schema update; do
  echo "skif features: ${features:-<none>}"
  cargo check -p skif --locked --no-default-features --features "$features"
  cargo test -p skif --locked --no-default-features --features "$features" --lib
  cargo test -p skif --locked --no-default-features --features "$features" --doc
done
'''

[tasks.check]
description = "Full local gate: what CI enforces except deny (needs cargo-deny) and the MSRV build"
run = [
  { task = "format:check" },
  { task = "lint" },
  { task = "test" },
  { task = "schema:check" },
  { task = "consistency" },
  { task = "docs:rust" },
  { task = "features" },
]

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.update]
description = "Update dependencies (compatible versions only, no manifest edits)"
run = "cargo update"

[tasks.upgrade]
description = "Upgrade dependencies to latest, including incompatible bumps (rewrites manifests)"
run = ["cargo upgrade --incompatible", "cargo update"]

[tasks."governance:generate"]
description = "Generate native AI governance outputs"
run = "npx -y ai-rulez@latest generate --no-local --strict-config"

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]
