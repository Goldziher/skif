version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    assignees:
      - "Goldziher"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(dev-deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      oxc:
        patterns:
          - "oxc*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
    open-pull-requests-limit: 5
    assignees:
      - "Goldziher"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    assignees:
      - "Goldziher"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(dev-deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      website:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/npm-package"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
    open-pull-requests-limit: 5
    assignees:
      - "Goldziher"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(dev-deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      npm-package:
        update-types:
          - "minor"
          - "patch"
