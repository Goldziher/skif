name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise run check-rust

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise run test

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust cargo-deny
      - run: mise run deny

  lint:
    name: Poly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: poly
      - run: mise run format:check
      - run: poly lint --no-workspace .

  action:
    name: Action bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: mise run action
      - name: Verify the committed bundle is current
        run: git diff --exit-code action/index.js
