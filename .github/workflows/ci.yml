name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: Toolchain baseline
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  # The shared org gate (poly fmt --check + poly lint over the whole repo), same as
  # basemind and uncomment run. `setup-rust` is required because poly.toml enables the
  # cargo/clippy hook. It needs no permissions beyond the workflow-level `contents: read`.
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true
      check-adrs: true
      lint-action-pins: true

  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast stays off so one platform's failure does not cancel the others.
      fail-fast: false
      matrix:
        # Windows is a shipped target and the only place the suite runs on a real Windows host.
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

  # The workspace Cargo.toml advertises a `rust-version`; published crates are resolved against it, so
  # it has to be true. The version is read out of the manifest rather than written here —
  # a hardcoded number is one more surface to bump, and this repo has several version surfaces.
  # Library and binary only, deliberately not `--all-targets`: dev-dependencies are not
  # bound by the crate's MSRV, and compiling them here would fail the job for a version
  # constraint that no consumer of the published crate is ever subject to.
  msrv:
    name: MSRV
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(awk '/^\[(workspace\.)?package\]/{p=1;next} /^\[/{p=0} p && /^rust-version *= *"/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          [[ -n "$version" ]] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: Check against the MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" check --workspace --locked

  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Verify the publishable crates
        run: cargo package --workspace --locked
      - name: Check that the JSON Schema file is current
        run: scripts/check-schema.sh target/debug/skif

  docs:
    name: Documentation
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --all-features --locked

  # The facade is embedded by hosts that pick features, so each feature has to compile on its own.
  features:
    name: Facade features (${{ matrix.features }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", manifest, js-analysis, fix, yaml-fix, report, schema, update]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.features }}
      - name: Check the facade with only this feature
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo check -p skif --locked --no-default-features --features "$FEATURES"
      - name: Test the facade (unit tests and doctests) with only this feature
        env:
          FEATURES: ${{ matrix.features }}
        # `--lib` and `--doc` cannot be combined in one invocation, so each runs on its own.
        run: |
          cargo test -p skif --locked --no-default-features --features "$FEATURES" --lib
          cargo test -p skif --locked --no-default-features --features "$FEATURES" --doc

  # Public API compatibility of every published crate against its latest crates.io release: the facade re-exports
  # the other crates, and cargo-semver-checks does not follow re-exports across crates. Advisory while skif is 0.x;
  # the per-crate result goes to the job summary, for a release PR to quote in the CHANGELOG.
  semver:
    name: Public API (cargo-semver-checks)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check every published crate
        run: bash scripts/semver-checks.sh

  deny:
    name: Licences, advisories, bans and sources
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  scripts:
    name: Shell scripts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          # `find` rather than a `**` glob: without `globstar`, bash reads `**` as `*` and skips scripts/*.sh.
          find scripts mise-tasks -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Test the npm registry probes (published version, package existence)
        run: bash scripts/test-npm-published.sh
      - name: Test the release scripts (Homebrew, Scoop, crates.io, semver checks, version bump, archive and release gates, npm install smoke)
        run: bash scripts/test-release-scripts.sh
      - name: Test the repository guards (pins, headers, rule ids, plugin lists, doc pins, layering, package contents, oxc patch, npm smoke)
        run: bash scripts/test-check-scripts.sh
      - name: Test the install scripts (pre-commit launcher and the Action's resolve, install and run steps)
        run: bash scripts/test-install-scripts.sh
      - name: Test the end-to-end scripts (version resolution, scenario generation, expectations)
        run: bash scripts/test-e2e-scripts.sh
      - name: Test the benchmark number refresh
        run: node --test tools/bench/refresh-numbers.test.mjs

  # The hooks as pre-commit runs them: this checkout is the hook repository, the fixtures are the projects.
  pre-commit-hook:
    name: pre-commit hooks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build skif
        run: cargo build --locked -p skif-cli
      - name: Install pre-commit
        run: pipx install pre-commit
      - name: Run the hooks against a clean and a dirty fixture
        run: bash scripts/test-pre-commit-hook.sh target/debug/skif

  # `uses: ./` against the newest published release: the Action resolves, downloads, verifies and runs it on every
  # runner OS. Before the first release there is nothing to download, so the job reports that and passes.
  action:
    name: GitHub Action (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Find the newest published release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::no published release yet; the Action self-test starts with the first one"
          fi
      - name: Install only
        id: install
        if: steps.release.outputs.tag != ''
        uses: ./
        with:
          version: ${{ steps.release.outputs.tag }}
          install-only: true
      - name: The installed binary is the requested release
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          VERSION: ${{ steps.install.outputs.version }}
          BINARY: ${{ steps.install.outputs.path }}
        run: |
          set -euo pipefail
          out="$("$BINARY" --version)"
          echo "$out"
          grep -qF "$VERSION" <<<"$out"
          [ "$(command -v skif)" ]
      - name: Run through the Action
        if: steps.release.outputs.tag != ''
        uses: ./
        with:
          version: ${{ steps.release.outputs.tag }}
          args: --version

  consistency:
    name: Version consistency
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that every release surface agrees on one version
        run: scripts/check-versions.sh
      - name: Check that the documentation examples pin the current release line
        run: scripts/check-doc-pins.sh
      - name: Check that oxc is pinned exactly and dependencies are inherited from the workspace
        run: scripts/check-pins.sh
      - name: Check the syncpack-vendored files' attribution headers and ATTRIBUTIONS.md
        run: scripts/check-headers.sh
      - name: Check that rule ids are never dropped
        run: scripts/check-rule-ids.sh
      - name: Check that the plugin lists in the docs match the plugin table
        run: scripts/check-plugin-list.sh
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check the dependency layering
        run: scripts/check-dependency-tree.sh
      - name: Check that every published crate ships LICENSE and ATTRIBUTIONS.md
        run: scripts/check-package-contents.sh

  npm-addon:
    name: npm addon (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ADR 0027: every non-end-of-life Node line (22, 24, 26) and the latest Bun 1.x.
        runtime: [node-22, node-24, node-26, bun]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node pnpm
      # The newest Bun 1.x (ADR 0027), resolved from the registry so Bun 2 does not silently enter the matrix.
      - name: Resolve the newest Bun 1.x
        id: bun
        if: matrix.runtime == 'bun'
        run: echo "version=$(scripts/e2e/resolve-pm-version.sh bun newest 1)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      # The `node` profile unwinds panics (the release profile aborts); `test-hooks` adds the deliberate panic the
      # smoke test throws to prove it reaches JavaScript as an exception.
      - name: Build the addon for the host
        working-directory: npm-package
        run: |
          pnpm install --frozen-lockfile
          pnpm build --features test-hooks
      - name: Smoke-test import, lint(), lintAsync(), a panic and the skif bin
        env:
          SKIF_EXPECT_PANIC_HOOK: "1"
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          case "$RUNTIME" in
            # Each Node line is selected by major so it tracks the newest release of that line; the lock covers only
            # the pinned 26.
            node-*) MISE_LOCKED=0 mise exec "node@${RUNTIME#node-}" -- bash scripts/npm-smoke.sh node ;;
            *) bash scripts/npm-smoke.sh "$RUNTIME" ;;
          esac

  # Builds the binary the e2e jobs share, once per runner OS, so the package-manager jobs do not each compile it.
  e2e-build:
    name: E2E build (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu, runner: ubuntu-latest }
          - { os: macos, runner: macos-26 }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build skif
        run: cargo build --locked
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-skif-${{ matrix.os }}
          path: target/debug/skif${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  # Runs the built binary against real workspaces installed by each package manager, so the
  # fixtures prove skif's view of a monorepo matches what npm, pnpm, Yarn and Bun actually accept.
  # One job per manager, slot and OS runs every scenario of fixtures/e2e under every linker of the manager.
  e2e:
    name: E2E (${{ matrix.package-manager }} ${{ matrix.slot }}, ${{ matrix.os }})
    needs: e2e-build
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      # fail-fast stays off so one package manager's failure does not hide the others.
      fail-fast: false
      matrix:
        # ADR 0027 and ADR 0105: the latest two majors of npm, pnpm and Yarn 2+ (`slot` picks the newest or the
        # previous major from the registry), the newest Yarn Classic 1.x and the newest Bun 1.x. The newest slot of
        # every manager runs on Linux, macOS and Windows; the previous majors run on Linux only.
        package-manager: [npm, pnpm, yarn, yarn-classic, bun]
        slot: [newest, previous]
        os: [ubuntu, macos, windows]
        exclude:
          - { package-manager: yarn-classic, slot: previous }
          - { package-manager: bun, slot: previous }
          - { slot: previous, os: macos }
          - { slot: previous, os: windows }
        include:
          - { os: ubuntu, runner: ubuntu-latest }
          - { os: macos, runner: macos-26 }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: e2e-skif-${{ matrix.os }}
          path: target/debug
      # ~keep Artifacts do not keep the executable bit.
      - name: Make skif executable
        run: chmod +x target/debug/skif*
      # node serves npm, pnpm and both Yarns; the package manager under test is installed below.
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node
      - name: Resolve the version under test
        id: version
        env:
          PM: ${{ matrix.package-manager }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          # Bun and Yarn Classic are tested on their newest 1.x, so a later major does not silently enter the matrix.
          major=""
          case "$PM" in bun | yarn-classic) major=1 ;; esac
          version="$(scripts/e2e/resolve-pm-version.sh "$PM" "$SLOT" ${major:+"$major"})"
          echo "Testing $PM $version (the $SLOT major)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: matrix.package-manager == 'bun'
        with:
          bun-version: ${{ steps.version.outputs.version }}
      - name: Install the package manager version under test
        if: matrix.package-manager != 'bun'
        env:
          PM: ${{ matrix.package-manager }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm | pnpm) npm install --global "${PM}@${VERSION}" ;;
            yarn-classic) npm install --global "yarn@${VERSION}" ;;
            # Node 25+ no longer bundles corepack, so Yarn Berry's corepack shim is installed explicitly.
            yarn)
              npm install --global corepack@latest
              corepack enable yarn
              corepack prepare "yarn@${VERSION}" --activate
              ;;
          esac
      - name: Run end-to-end tests
        env:
          PM: ${{ matrix.package-manager }}
          E2E_PM_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/e2e/run.sh "$PM" target/debug/skif
