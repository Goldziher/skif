name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: Toolchain baseline
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  # The shared org gate (poly fmt --check + poly lint over the whole repo), same as
  # basemind and uncomment run. `setup-rust` is required because poly.toml enables the
  # cargo/clippy hook. It needs no permissions beyond the workflow-level `contents: read`.
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true
      check-adrs: true
      lint-action-pins: true

  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast stays off so one platform's failure does not cancel the others.
      fail-fast: false
      matrix:
        # Windows is a shipped target and the only place the suite runs on a real Windows host.
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

  # The workspace Cargo.toml advertises a `rust-version`; published crates are resolved against it, so
  # it has to be true. The version is read out of the manifest rather than written here —
  # a hardcoded number is one more surface to bump, and this repo has several version surfaces.
  # Library and binary only, deliberately not `--all-targets`: dev-dependencies are not
  # bound by the crate's MSRV, and compiling them here would fail the job for a version
  # constraint that no consumer of the published crate is ever subject to.
  msrv:
    name: MSRV
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(awk '/^\[(workspace\.)?package\]/{p=1;next} /^\[/{p=0} p && /^rust-version *= *"/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          [[ -n "$version" ]] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install the MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: Check against the MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" check --workspace --locked

  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Verify the publishable crates
        run: cargo package --workspace --locked
      - name: Check that the JSON Schema file is current
        run: scripts/check-schema.sh target/debug/skif

  docs:
    name: Documentation
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --all-features --locked

  # The facade is embedded by hosts that pick features, so each feature has to compile on its own.
  features:
    name: Facade features (${{ matrix.features }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", manifest, policy, js-analysis, fix, yaml-fix, report, schema]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.features }}
      - name: Check the facade with only this feature
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo check -p skif --locked --no-default-features --features "$FEATURES"

  deny:
    name: Licences, advisories, bans and sources
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  scripts:
    name: Shell scripts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          # `find` rather than a `**` glob: without `globstar`, bash reads `**` as `*` and skips scripts/*.sh.
          find scripts mise-tasks -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Test the npm publish probe
        run: bash scripts/test-npm-published.sh

  consistency:
    name: Version consistency
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that every release surface agrees on one version
        run: scripts/check-versions.sh
      - name: Check that oxc is pinned exactly and dependencies are inherited from the workspace
        run: scripts/check-pins.sh
      - name: Check that vendored files carry their attribution headers
        run: scripts/check-headers.sh
      - name: Check that rule ids are never dropped
        run: scripts/check-rule-ids.sh
      - name: Check that the plugin lists in the docs match the plugin table
        run: scripts/check-plugin-list.sh
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check the dependency layering
        run: scripts/check-dependency-tree.sh
      - name: Check that every published crate ships LICENSE and ATTRIBUTIONS.md
        run: scripts/check-package-contents.sh

  npm-addon:
    name: npm addon (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # node-24 is the engines floor; node and bun are the versions pinned in mise.toml.
        runtime: [node-24, node, bun]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node pnpm bun
      # The `node` profile unwinds panics (the release profile aborts); `test-hooks` adds the deliberate panic the
      # smoke test throws to prove it reaches JavaScript as an exception.
      - name: Build the addon for the host
        working-directory: npm-package
        run: |
          pnpm install --frozen-lockfile
          pnpm build --features test-hooks
      - name: Smoke-test import, lint(), lintAsync(), a panic and the skif bin
        env:
          SKIF_EXPECT_PANIC_HOOK: "1"
        run: |
          set -euo pipefail
          case "${{ matrix.runtime }}" in
            # Node 24 is the engines floor, not a pinned tool, so it bypasses the locked lockfile.
            node-24) MISE_LOCKED=0 mise exec node@24 -- bash scripts/npm-smoke.sh node ;;
            *) bash scripts/npm-smoke.sh "${{ matrix.runtime }}" ;;
          esac

  # Runs the built binary against real workspaces installed by each package manager, so the
  # fixtures prove skif's view of a monorepo matches what npm, pnpm, yarn and bun actually accept.
  e2e:
    name: E2E (${{ matrix.package-manager }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      # fail-fast stays off so one package manager's failure does not hide the others.
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # node serves npm, yarn (through corepack) and pnpm's own runtime; pnpm is pinned in mise.toml.
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.package-manager == 'bun'
      # ~keep Node 25+ no longer bundles corepack, so yarn's corepack shim is installed explicitly.
      - name: Enable corepack
        if: matrix.package-manager == 'yarn'
        run: |
          npm install --global corepack@latest
          corepack enable
      - name: Build skif
        run: cargo build --locked
      - name: Run end-to-end tests
        run: scripts/e2e/run.sh ${{ matrix.package-manager }} target/debug/skif
