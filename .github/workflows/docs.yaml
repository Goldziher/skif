name: docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/rules.md"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "website/**"
      - "docs/rules.md"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yaml"
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The build also validates internal links (starlight-links-validator) and fails on a broken one.
      - name: Build site and check links
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
