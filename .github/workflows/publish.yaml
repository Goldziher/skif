name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  # Everything the release builds, packs or verifies triggers the dry run, so the first full run of a change is
  # never the real tag.
  pull_request:
    paths:
      - .github/workflows/publish.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - crates/skif-node/**
      - crates/skif-cli/**
      - npm-package/**
      - action.yml
      - scripts/lib/**
      - scripts/check-archive.sh
      - scripts/check-glibc-floor.sh
      - scripts/check-libc-selection.sh
      - scripts/check-npm-packages-exist.sh
      - scripts/check-npm-tarballs.sh
      - scripts/check-release-gate.sh
      - scripts/check-versions.sh
      - scripts/e2e/resolve-pm-version.sh
      - scripts/load-addon.mjs
      - scripts/npm-published.sh
      - scripts/publish-crates.sh
      - scripts/release-assets.sh
      - scripts/release-bump.sh
  # A weekly dry run catches toolchain, runner-image and dependency drift between releases.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: false
        type: string
      dry-run:
        description: "Build the eight release targets and the six npm addons and verify the release assets, but publish nothing"
        type: boolean
        default: false

concurrency:
  # Keyed on the resolved release tag so a tag push and a dispatch for the same tag cannot race.
  # A publish is never cancelled mid-flight: cargo publish and release promotion are irreversible.
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege at the workflow level. Jobs that create, upload to or promote the release add
# `contents: write`, and the registry jobs add `id-token: write`, because trusted publishing mints its
# credential from that claim.
permissions:
  contents: read

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh run list` reads the CI runs of the tagged commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_complete: ${{ steps.release.outputs.release_complete }}
      bun: ${{ steps.bun.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Resolve version, tag and mode
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          set -euo pipefail
          workspace_version="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version *= *"/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          dry_run=false
          case "$EVENT_NAME" in
          push) tag="${GITHUB_REF#refs/tags/}" ;;
          pull_request | schedule)
            dry_run=true
            tag="v${workspace_version}"
            ;;
          *)
            tag="$INPUT_TAG"
            [ "$INPUT_DRY_RUN" = "true" ] && dry_run=true
            if [ -z "$tag" ]; then
              if [ "$dry_run" = "true" ]; then
                tag="v${workspace_version}"
              else
                echo "::error::The tag input is required unless dry-run is set"
                exit 1
              fi
            fi
            ;;
          esac
          version="${tag#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "tag=$tag version=$version dry_run=$dry_run prerelease=$prerelease"

      - name: Verify version consistency
        run: scripts/check-versions.sh "${{ steps.version.outputs.version }}"

      # The newest Bun 1.x (ADR 0027), resolved once so every Bun job of the run tests the same release and Bun 2 does
      # not silently enter the matrix.
      - name: Resolve the newest Bun 1.x
        id: bun
        run: echo "version=$(scripts/e2e/resolve-pm-version.sh bun newest 1)" >> "$GITHUB_OUTPUT"

      # A real release is irreversible, so the tagged commit must be on main and have passed ci.yml. Dry runs
      # (pull requests, dispatch with dry-run) build from arbitrary branches and skip the gate.
      - name: Verify the tag is on main with green CI
        if: steps.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/check-release-gate.sh "$TAG"

      # npm trusted publishing works only on a package that exists, so a platform package never published by hand
      # would fail its first publish after crates.io and the earlier npm packages are live. Fail before the release.
      - name: Verify every npm package exists
        if: steps.version.outputs.dry_run != 'true'
        run: bash scripts/check-npm-packages-exist.sh npm-package/package.json

      - name: Detect a complete GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ steps.version.outputs.dry_run }}
        run: |
          set -euo pipefail
          complete=false
          if [ "$DRY_RUN" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft -q '.isDraft')"
            if [ "$draft" != "true" ] && gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'checksums.txt'; then
              complete=true
            fi
          fi
          echo "release_complete=$complete" >>"$GITHUB_OUTPUT"
          echo "GitHub release complete? $complete"

  create_release:
    name: Create draft GitHub release
    needs: meta
    if: needs.meta.outputs.dry_run != 'true' && needs.meta.outputs.release_complete != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the draft release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            if [ "$(gh release view "$TAG" --json isDraft -q '.isDraft')" != "true" ]; then
              echo "::warning::release $TAG is published but incomplete; reverting to draft until its assets are complete"
              gh release edit "$TAG" --draft=true
            fi
          else
            flag=""
            [ "$PRERELEASE" = "true" ] && flag="--prerelease"
            # shellcheck disable=SC2086
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" --verify-tag --draft $flag
          fi

  build:
    name: Build / ${{ matrix.target }}
    needs: [meta, create_release]
    if: >-
      always() && needs.meta.result == 'success'
      && needs.create_release.result != 'failure' && needs.create_release.result != 'cancelled'
      && needs.meta.outputs.release_complete != 'true'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The glibc archives are linked against a glibc 2.34 sysroot (cargo-zigbuild), whatever the runner has, so
          # they start on every glibc 2.34+ host. Older glibc hosts use the musl archives; the installers pick them.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.34"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            glibc: "2.34"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            alpine: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            alpine: true
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        if: ${{ !matrix.alpine }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup cache
        if: ${{ !matrix.alpine }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup zig
        if: ${{ matrix.glibc }}
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: ${{ matrix.glibc }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binary (glibc floor)
        if: ${{ matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        # `<target>.<glibc>` links against that glibc; the output stays under target/<target>/.
        run: cargo zigbuild --release --locked -p skif-cli --target "${TARGET}.${GLIBC}"
        shell: bash

      - name: Verify the glibc floor
        if: ${{ matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: bash scripts/check-glibc-floor.sh "target/$TARGET/release/skif" "$GLIBC"
        shell: bash

      - name: Build binary
        if: ${{ !matrix.alpine && !matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          # The MSVC runtime is linked statically so skif.exe starts without the VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p skif-cli --target "$TARGET"
        shell: bash

      - name: Build binary (musl, Alpine container)
        if: ${{ matrix.alpine }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The image's host target is the musl triple being released, so the build is host-native.
          docker run --rm -v "$PWD":/work -w /work -e CARGO_TARGET_DIR=/work/target -e TARGET rust:alpine sh -c '
            set -e
            apk add --no-cache build-base musl-dev git perl
            cargo build --release --locked -p skif-cli
            mkdir -p "target/$TARGET/release"
            cp target/release/skif "target/$TARGET/release/skif"
            strip "target/$TARGET/release/skif"
          '
        shell: bash

      - name: Strip binary
        if: ${{ !matrix.alpine && runner.os != 'Windows' }}
        env:
          TARGET: ${{ matrix.target }}
        run: strip "target/$TARGET/release/skif" || true
        shell: bash

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp LICENSE ATTRIBUTIONS.md "$stage/"
          case "$TARGET" in
          *windows*)
            cp "target/$TARGET/release/skif.exe" "$stage/"
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/skif-$TARGET.zip" skif.exe LICENSE ATTRIBUTIONS.md)
            ;;
          *)
            cp "target/$TARGET/release/skif" "$stage/"
            tar czf "skif-$TARGET.tar.gz" -C "$stage" skif LICENSE ATTRIBUTIONS.md
            ;;
          esac
        shell: bash

      - name: Smoke test the binary
        if: ${{ !startsWith(matrix.target, 'aarch64-pc-windows') }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
          *windows*) "target/$TARGET/release/skif.exe" --version ;;
          *) "target/$TARGET/release/skif" --version ;;
          esac
        shell: bash

      - name: Save archive for checksums
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: |
            skif-${{ matrix.target }}.tar.gz
            skif-${{ matrix.target }}.zip
          if-no-files-found: error

      - name: Upload archive to the draft release
        if: needs.meta.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$TAG" skif-"$TARGET".* --clobber
        shell: bash

  # A dry run skips create_release, which would skip everything below `build` through the implicit success(): each
  # job names the results it needs under always(), so the rehearsal runs the smoke tests and checksums too.
  # The aarch64 Windows binary is cross-built on an x64 runner, which cannot run it. Execute the packaged archive
  # on a real ARM64 Windows runner before it can be released.
  smoke_windows_arm64:
    name: Smoke test aarch64-pc-windows-msvc
    needs: [meta, build]
    if: always() && needs.build.result == 'success'
    runs-on: windows-11-arm
    steps:
      - name: Download the archive
        uses: actions/download-artifact@v8
        with:
          name: archive-aarch64-pc-windows-msvc
          path: archive

      # Git for Windows' GNU tar cannot read zip archives, so the archive is unpacked the way a Windows user does.
      - name: Unpack and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path archive/skif-aarch64-pc-windows-msvc.zip -DestinationPath unpacked
          foreach ($member in 'skif.exe', 'LICENSE', 'ATTRIBUTIONS.md') {
            if (-not (Test-Path "unpacked/$member")) { throw "the archive does not contain $member" }
          }
          ./unpacked/skif.exe --version
          if ($LASTEXITCODE -ne 0) { throw "skif.exe --version exited with $LASTEXITCODE" }

  # The glibc archives promise glibc 2.34. Run the installers' libc rule and the binary it picks on distributions on
  # both sides of that floor: older glibc must get musl, 2.34 itself and newer must get glibc.
  smoke_linux_libc:
    name: Smoke test libc selection (${{ matrix.case.image }}, ${{ matrix.runner }})
    needs: [meta, build]
    if: always() && needs.build.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        case:
          - { image: "debian:11", libc: musl } # glibc 2.31
          - { image: "almalinux:8", libc: musl } # glibc 2.28
          - { image: "almalinux:9", libc: gnu } # glibc 2.34, the floor itself
          - { image: "ubuntu:22.04", libc: gnu } # glibc 2.35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Download the Linux archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*-unknown-linux-*
          merge-multiple: true
          path: archives

      - name: Unpack this architecture's binaries
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          for libc in gnu musl; do
            mkdir -p "bins/${libc}"
            tar -xzf "archives/skif-${arch}-unknown-linux-${libc}.tar.gz" -C "bins/${libc}" skif
          done

      - name: Select and run the binary in the container
        env:
          IMAGE: ${{ matrix.case.image }}
          EXPECTED: ${{ matrix.case.libc }}
        run: >-
          docker run --rm
          -v "$PWD/scripts":/scripts:ro -v "$PWD/bins":/bins:ro
          "$IMAGE" bash /scripts/check-libc-selection.sh /bins "$EXPECTED"

  checksums:
    name: Generate checksums
    needs: [meta, build, smoke_windows_arm64, smoke_linux_libc]
    if: >-
      always() && needs.meta.result == 'success' && needs.meta.outputs.release_complete != 'true'
      && needs.build.result == 'success' && needs.smoke_windows_arm64.result == 'success'
      && needs.smoke_linux_libc.result == 'success'
    permissions:
      contents: write
      # Build provenance: the attestation is signed with the workflow's OIDC identity and stored with the repository.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Download all archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: artifacts

      - name: Verify the archive set
        run: |
          set -euo pipefail
          expected="$(scripts/release-assets.sh | grep -vx 'checksums.txt' | sort)"
          actual="$(cd artifacts && find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::archive set differs from the expected eight archives"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "All eight archives are present"

      - name: Verify every archive ships the binary, LICENSE and ATTRIBUTIONS.md
        run: bash scripts/check-archive.sh artifacts/skif-*

      # The Action and the launcher check the downloaded archive with `gh attestation verify`; checksums.txt alone
      # ships from the same place as the archive and only detects corruption.
      - name: Attest the archives' build provenance
        if: needs.meta.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/skif-*

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd artifacts && LC_ALL=C sha256sum skif-* | LC_ALL=C sort -k2) >checksums.txt
          cat checksums.txt
          (cd artifacts && sha256sum -c ../checksums.txt)

      - name: Save checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums.txt
          if-no-files-found: error

      - name: Upload checksums to the draft release
        if: needs.meta.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" checksums.txt --clobber

  # crates.io is irreversible, so it also waits for the npm addons to load on every platform: an npm-side failure must
  # stop the release before any crate is live, not after.
  publish_crates:
    name: Publish crates.io
    needs: [meta, checksums, load_addon]
    if: >-
      always() && needs.meta.result == 'success' && needs.load_addon.result == 'success'
      && (needs.meta.outputs.dry_run == 'true'
          || needs.checksums.result == 'success'
          || needs.meta.outputs.release_complete == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate to crates.io
        if: needs.meta.outputs.dry_run != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: crates_auth

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          DRY_RUN: ${{ needs.meta.outputs.dry_run }}
        run: scripts/publish-crates.sh

  # The release stays a draft until the registries have the version and the npm package runs: a failed crates.io or npm
  # publish must not leave a public release (which the Action's `latest` and the Homebrew and Scoop updates serve at
  # once) that `cargo install` and `npx` cannot match. Only cargo binstall needs the public release, so it is verified
  # after this job.
  finalize_release:
    name: Publish GitHub release
    needs: [meta, checksums, publish_crates, verify_npm]
    if: >-
      always() && needs.meta.result == 'success' && needs.meta.outputs.dry_run != 'true'
      && needs.meta.outputs.release_complete != 'true' && needs.checksums.result == 'success'
      && needs.publish_crates.result == 'success' && needs.verify_npm.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Promote the draft once the asset set is exact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(scripts/release-assets.sh | sort)"
          actual="$(gh release view "$TAG" --json assets -q '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::release $TAG asset list differs from the expected eight archives plus checksums.txt; leaving it as a draft"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          echo "Published $TAG"

  verify_binstall:
    name: Verify cargo binstall
    needs: [meta, publish_crates, finalize_release]
    if: >-
      always() && needs.meta.outputs.dry_run != 'true' && needs.publish_crates.result == 'success'
      && (needs.finalize_release.result == 'success' || needs.meta.outputs.release_complete == 'true')
    permissions:
      contents: read
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: skif-cli
      binary-name: skif
      manifest-path: crates/skif-cli
      checkout-ref: ${{ needs.meta.outputs.tag }}
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "macos-26", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      smoke-command: |
        skif --version

  build_npm:
    name: Build npm addon / ${{ matrix.target }}
    needs: [meta]
    if: always() && needs.meta.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc targets cross-build with napi-rs's bundled sysroot (--use-napi-cross) so the addon loads on old
          # distributions; musl targets cross-build with zig (-x). Darwin builds natively.
          # glibc floor: the addons target napi-rs's sysroot (glibc 2.17). The binary archives of the `build` job are
          # linked against glibc 2.34, so `skif-*-linux-gnu.tar.gz` needs that or newer; older distributions use the
          # musl archives, which the installers select.
          # The generated loader (index.js, index.d.ts) lists every platform and is the same in each build; the
          # x86_64 glibc build uploads it for the umbrella package, which is gitignored and exists nowhere else.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            napi_flags: --use-napi-cross
            upload_loader: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            napi_flags: --use-napi-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            napi_flags: -x
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            napi_flags: -x
            zig: true
          - target: x86_64-apple-darwin
            os: macos-26-intel
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-26
            smoke: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: napi-${{ matrix.target }}

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Setup zig
        if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install napi-rs
        working-directory: npm-package
        run: pnpm install --frozen-lockfile

      - name: Build the addon
        working-directory: npm-package
        env:
          # A musl cdylib must link the C runtime dynamically.
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
          # ring's assembly needs __ARM_ARCH, which the gcc of napi-rs's aarch64 glibc sysroot does not define.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        run: >-
          pnpm exec napi build --platform --profile node --esm --package skif-node
          --manifest-path ../crates/skif-node/Cargo.toml --output-dir .
          --target ${{ matrix.target }} ${{ matrix.napi_flags }}

      - name: Smoke test the addon
        if: ${{ matrix.smoke }}
        working-directory: npm-package
        run: node ../scripts/load-addon.mjs .

      - name: Save the addon
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: npm-package/skif.*.node
          if-no-files-found: error

      - name: Save the generated loader
        if: ${{ matrix.upload_loader }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-loader
          path: |
            npm-package/index.js
            npm-package/index.d.ts
          if-no-files-found: error

  # Loads every Linux addon on its own platform before anything is published: a cross-compiled or musl addon can
  # build cleanly and still fail to load (wrong libc, unresolved symbol). The musl addons run in an Alpine container.
  load_addon:
    name: Load npm addon / ${{ matrix.target }}
    needs: [meta, build_npm]
    if: always() && needs.build_npm.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            alpine: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            alpine: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Download the generated loader
        uses: actions/download-artifact@v8
        with:
          name: npm-loader
          path: npm-package

      - name: Download the addon
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: npm-package

      - name: Setup Node.js
        if: ${{ !matrix.alpine }}
        uses: xberg-io/actions/setup-mise@v1
        with:
          config-ref: ${{ github.sha }}
          tools: node

      - name: Load the addon and run skif --version
        if: ${{ !matrix.alpine }}
        run: node scripts/load-addon.mjs npm-package

      - name: Load the addon and run skif --version (Alpine container)
        if: ${{ matrix.alpine }}
        run: >-
          docker run --rm
          -v "$PWD/npm-package":/addon:ro -v "$PWD/scripts/load-addon.mjs":/check/load-addon.mjs:ro
          node:22-alpine node /check/load-addon.mjs /addon

  # Generates the platform packages and packs every npm tarball once, in the dry run as well. publish_npm publishes
  # these tarballs, so what is checked is what is published.
  pack_npm:
    name: Pack npm packages
    needs: [meta, build_npm]
    if: always() && needs.meta.result == 'success' && needs.build_npm.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm-package
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Install napi-rs
        run: pnpm install --frozen-lockfile

      - name: Download the built addons
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: npm-package/artifacts

      # index.js and index.d.ts are generated by `napi build` and gitignored, so the umbrella package gets them
      # from the build, never from the checkout.
      - name: Download the generated loader
        uses: actions/download-artifact@v8
        with:
          name: npm-loader
          path: npm-package

      - name: Generate the platform packages
        run: |
          set -euo pipefail
          # npm/<platform>/package.json for every target in package.json's napi config, then the .node files into them.
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts --npm-dir npm
          # napi writes no licence files; the MIT and ISC notices of derived code travel with every addon.
          for dir in npm/*/; do
            cp ../LICENSE ../ATTRIBUTIONS.md "$dir"
            tmp="$(mktemp)"
            jq '.files = ((.files // []) + ["LICENSE", "ATTRIBUTIONS.md"] | unique)' "${dir}package.json" >"$tmp"
            cat "$tmp" >"${dir}package.json"
            rm -f "$tmp"
          done
          # Writes the umbrella's optionalDependencies. The platform packages are published by publish_npm.
          pnpm exec napi prepublish -t npm --no-gh-release --skip-optional-publish

      # The umbrella must ship the generated loader and bin, and the six platform packages must each carry their
      # addon.
      - name: Pack the packages and check their contents
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          packs="$RUNNER_TEMP/npm-packs"
          mkdir -p "$packs"
          for dir in npm/*/ .; do
            (cd "$dir" && pnpm pack --pack-destination "$packs")
          done
          bash ../scripts/check-npm-tarballs.sh "$packs" "$VERSION"

      - name: Save the tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-packs/*.tgz
          if-no-files-found: error

  publish_npm:
    name: Publish npm (skif-cli)
    needs: [meta, pack_npm, load_addon, checksums]
    if: >-
      always() && needs.meta.result == 'success' && needs.pack_npm.result == 'success'
      && needs.load_addon.result == 'success'
      && (needs.meta.outputs.dry_run == 'true'
          || needs.checksums.result == 'success'
          || needs.meta.outputs.release_complete == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm trusted publishing exchanges for a publish credential.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Download the tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-packs

      - name: Check the tarballs
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/check-npm-tarballs.sh "$RUNNER_TEMP/npm-packs" "$VERSION"

      # Each tarball is unpacked and published from its directory, so the published contents are the packed ones.
      - name: Publish to npm
        if: needs.meta.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          npm_tag=latest
          [ "$PRERELEASE" = "true" ] && npm_tag=next
          packs="$RUNNER_TEMP/npm-packs"
          unpacked="$RUNNER_TEMP/npm-publish"

          publish_one() {
            local tarball="$1" dir name state
            dir="${unpacked}/$(basename "$tarball" .tgz)"
            mkdir -p "$dir"
            tar -xzf "$tarball" -C "$dir"
            dir="${dir}/package"
            name="$(jq -r '.name' "$dir/package.json")"
            # The probe fails the job unless the registry gave a definite answer (a 404 is "unpublished").
            state="$(bash scripts/npm-published.sh "$name" "$VERSION")"
            if [ "$state" = "published" ]; then
              echo "${name}@${VERSION} is already published; skipping"
              return 0
            fi
            echo "publishing ${name}@${VERSION} (--tag ${npm_tag})"
            (cd "$dir" && pnpm publish --no-git-checks --provenance --access public --tag "$npm_tag")
          }

          # Platform packages first: the umbrella must never list a package that does not exist.
          umbrella="${packs}/skif-cli-${VERSION}.tgz"
          platforms=()
          for tarball in "$packs"/*.tgz; do
            [ "$tarball" = "$umbrella" ] || platforms+=("$tarball")
          done
          expected="$(tar -xzOf "$umbrella" package/package.json | jq -er '.optionalDependencies | length | select(. > 0)')"
          [ "${#platforms[@]}" -eq "$expected" ] || { echo "::error::npm platform inventory is incomplete"; exit 1; }
          for tarball in "${platforms[@]}"; do
            publish_one "$tarball"
          done
          publish_one "$umbrella"

  verify_npm:
    name: Verify npx skif-cli (${{ matrix.runtime }})
    needs: [meta, publish_npm]
    if: needs.meta.outputs.dry_run != 'true' && needs.publish_npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ADR 0027: every non-end-of-life Node line (22, 24 and 26) and the newest Bun 1.x.
        runtime: [node-22, node-24, node-26, bun]
    defaults:
      run:
        shell: bash
    steps:
      # setup-mise reads mise.toml: it needs the repository.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Setup Node.js
        if: ${{ matrix.runtime != 'bun' }}
        uses: xberg-io/actions/setup-mise@v1
        with:
          config-ref: ${{ github.sha }}
          tools: node

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ needs.meta.outputs.bun }}

      - name: Run the published package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          run_published() {
            case "$RUNTIME" in
            # Each Node line is selected by major so it tracks the newest release of that line; only 26 is the pinned
            # tool, and the lock does not cover the others.
            node-*) MISE_LOCKED=0 mise exec "node@${RUNTIME#node-}" -- npm exec --yes "skif-cli@${VERSION}" -- --version ;;
            bun) bunx --bun -p "skif-cli@${VERSION}" skif --version ;;
            esac
          }
          # npm processes a publish before serving it, which has taken over two minutes.
          for attempt in {1..28}; do
            if out="$(run_published 2>&1)" && grep -qF "$VERSION" <<<"$out"; then
              echo "$out"
              exit 0
            fi
            echo "attempt ${attempt}: ${out}"
            sleep 15
          done
          echo "::error::skif-cli@${VERSION} did not print the released version under ${RUNTIME}"
          exit 1

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, verify_binstall, verify_npm]
    if: needs.meta.outputs.prerelease != 'true' && needs.verify_binstall.result == 'success' && needs.verify_npm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Update tap formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so the Homebrew tap cannot be updated"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir sums --clobber
          scripts/homebrew-update.sh "$VERSION" sums/checksums.txt "$GITHUB_REPOSITORY" >skif.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/homebrew-tap.git" tap
          cp skif.rb tap/Formula/skif.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/skif.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "skif ${VERSION}"
            git push
          fi

  publish_scoop:
    name: Update Scoop bucket
    needs: [meta, verify_binstall, verify_npm]
    if: needs.meta.outputs.prerelease != 'true' && needs.verify_binstall.result == 'success' && needs.verify_npm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Update bucket manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so Goldziher/scoop-bucket cannot be updated"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir sums --clobber
          scripts/scoop-update.sh "$VERSION" sums/checksums.txt "$GITHUB_REPOSITORY" >skif.json

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/scoop-bucket.git" bucket
          cp skif.json bucket/bucket/skif.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/skif.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date."
          else
            git commit -m "skif ${VERSION}"
            git push
          fi

  update_major_tag:
    name: Move the floating version tag
    needs: [meta, verify_binstall, verify_npm]
    if: needs.meta.outputs.prerelease != 'true' && needs.verify_binstall.result == 'success' && needs.verify_npm.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.tag }}
          # GITHUB_TOKEN cannot create or move a tag onto a commit that changes a workflow; the push needs `workflows`.
          token: ${{ secrets.HOMEBREW_TOKEN }}

      - name: Move the floating tag to this release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/release-floating-tag.sh "$VERSION" "$TAG"
