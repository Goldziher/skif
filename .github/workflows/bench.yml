name: bench

# The published speed benchmarks (ADR 0113): skif against the sherif, syncpack and knip pinned in
# tools/bench/corpus.toml, on a pinned GitHub-hosted runner image, run by hand only. The harness, its mise tools and the
# corpus come from the dispatched ref, checked out at the workspace root; the measured skif from the `ref` input,
# checked out in measured/ (untracked there, so the harness commit stays clean). The summary records the machine, the
# runner and the toolchain. `mise run bench:import -- <run-id>` brings the results into the repository.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch of skif to measure (default: the dispatched ref)"
        required: false
        default: ""
      runner:
        description: "Runner image; only pinned labels, so a run names the image it ran on"
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
      runs:
        description: "hyperfine measured runs per command"
        required: true
        default: "15"
      warmup:
        description: "hyperfine warmup runs per command"
        required: true
        default: "3"
      only:
        description: "Comma-separated bench corpus repositories (default: all); a partial run cannot be imported"
        required: false
        default: ""

# ~keep Runs on one runner image queue instead of overlapping; a running one is never cancelled. GitHub keeps one
# ~keep pending run per group: a dispatch made while another one waits cancels the waiting one.
concurrency:
  group: bench-${{ inputs.runner }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ~keep The corepack whose pnpm and yarn shims install the corpus: each repository's `packageManager` selects the
  # ~keep version, and a repository without one gets the version this corepack names as its default (never the
  # ~keep registry's latest).
  COREPACK_VERSION: "0.36.0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  bench:
    name: Benchmark on ${{ inputs.runner }}
    timeout-minutes: 300
    runs-on: ${{ inputs.runner }}
    env:
      # ~keep A tool that mise.lock does not pin for the runner fails the install instead of resolving a version.
      MISE_LOCKED: "1"
    steps:
      - name: Check the inputs
        env:
          RUNS: ${{ inputs.runs }}
          WARMUP: ${{ inputs.warmup }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          [[ "$RUNS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::runs must be a positive integer, got '$RUNS'"; exit 1; }
          [[ "$WARMUP" =~ ^[0-9]+$ ]] || { echo "::error::warmup must be a non-negative integer, got '$WARMUP'"; exit 1; }
          [[ "$ONLY" =~ ^[A-Za-z0-9._,-]*$ ]] || { echo "::error::only must be comma-separated repository names, got '$ONLY'"; exit 1; }
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the skif to measure
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: measured
          persist-credentials: false
      - name: Resolve the measured commit and the Rust toolchains
        id: resolve
        run: |
          set -euo pipefail
          # ~keep Each checkout builds with the rust-version its Cargo.toml declares (the MSRV the CI job checks)
          # ~keep rather than whatever `stable` is on the day of the run. It names a minor release, so the toolchain is
          # ~keep that release's latest patch; the summary records the exact rustc.
          measured="$(bash scripts/msrv.sh measured/Cargo.toml)" ||
            { echo "::error::measured/Cargo.toml declares no rust-version"; exit 1; }
          harness="$(bash scripts/msrv.sh Cargo.toml)" || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          sha="$(git -C measured rev-parse HEAD)"
          echo "Measuring ${sha} with Rust ${measured}; harness $(git rev-parse HEAD) with Rust ${harness}"
          {
            echo "sha=${sha}"
            echo "short=${sha:0:12}"
            echo "rust=${measured}"
            echo "harness_rust=${harness}"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.resolve.outputs.rust }}
      - name: Install the harness toolchain
        if: steps.resolve.outputs.harness_rust != steps.resolve.outputs.rust
        env:
          TOOLCHAIN: ${{ steps.resolve.outputs.harness_rust }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
      # ~keep Caches compiled dependencies only; the corpus, its installs and the generated workspaces live outside
      # ~keep both target directories, so nothing that is timed comes from a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            measured -> target
      # ~keep No pnpm from mise here: the corpus installs use corepack's shims, so the summary's pnpm and yarn are the
      # ~keep shims' defaults and each corpus target records the version its install ran with.
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node hyperfine
      # ~keep Node 25+ no longer bundles corepack, so it is installed explicitly, at a pinned version.
      - name: Enable corepack
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable yarn pnpm
      - name: Build the skif to measure
        working-directory: measured
        env:
          TOOLCHAIN: ${{ steps.resolve.outputs.rust }}
        run: cargo "+${TOOLCHAIN}" build --release --locked -p skif-cli
      - name: Build the harness
        env:
          TOOLCHAIN: ${{ steps.resolve.outputs.harness_rust }}
        run: cargo "+${TOOLCHAIN}" build --release --locked -p skif-bench
      # ~keep The harness rejects a corpus repository not pinned to a full commit SHA and a comparison tool not pinned
      # ~keep to an exact version, so an unpinned input fails the run before anything is timed. RUSTUP_TOOLCHAIN makes
      # ~keep the recorded rustc the one that built skif. The corpus and the generated workspaces go to the runner's
      # ~keep temporary directory, outside every git checkout.
      - name: Benchmark
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.resolve.outputs.rust }}
          RUNS: ${{ inputs.runs }}
          WARMUP: ${{ inputs.warmup }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(
            run
            --skif measured/target/release/skif
            --skif-source measured
            --out bench-results
            --corpus-dir "${RUNNER_TEMP}/bench-work/corpus"
            --generated-dir "${RUNNER_TEMP}/bench-work/generated"
            --runs "$RUNS"
            --warmup "$WARMUP"
            --install
            --no-enforce
          )
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          target/release/skif-bench "${args[@]}"
      - name: Write the results to the job summary
        if: ${{ !cancelled() }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            if [ -f bench-results/summary.md ]; then
              cat bench-results/summary.md
              # shellcheck disable=SC2016 # the backticks are Markdown, not a command substitution
              printf '\nImport with `mise run bench:import -- %s`.\n' "$RUN_ID"
            else
              echo "# skif benchmark: no summary (the run stopped before it)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # ~keep Only once there is a summary, so a run that stops before it shows one failing step.
      - name: Upload the results
        if: ${{ !cancelled() && steps.resolve.outputs.short != '' && hashFiles('bench-results/summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ steps.resolve.outputs.short }}-${{ inputs.runner }}
          path: |
            bench-results/summary.json
            bench-results/summary.md
            bench-results/raw/
          if-no-files-found: error
