version = "5.0"
default_layers = ["plugins"]
name = "skif"
description = "Rust dependency linter for JavaScript and TypeScript monorepos: workspace, manifest and version-policy rules with fixes, built library-first."
gitignore = true

presets = ["claude", "codex", "opencode"]

# The `testing` builtin is excluded: the hand-written `tdd-and-hooks` rule carries this project's testing policy, and
# the builtin's "delete production code written before the test" rule contradicts `minimal-changes`.
builtins = ["rust", "security", "git-workflow", "code-quality", "!testing", "documentation", "default-commands"]

# OpenCode reads a bare alias such as `sonnet` as a provider with no model, so its agents get a
# provider-qualified model; every other preset keeps the agents' own `model`.
[defaults.model_by_preset]
opencode = "anthropic/claude-sonnet-5-5"

[[mcp_servers]]
name = "poly"
description = "Lint, format, and cache over MCP — the poly binary's stdio server."
command = "poly"
args = ["mcp"]
package = "pkg:github/Goldziher/poly@v0.32.2"

[mcp]
self_server_command = ["npx", "-y", "ai-rulez@latest", "mcp"]

[lock]
include_outputs = false

[codex]
project_doc_max_bytes = 65536

[lint.load_budgets]
codex-agents-chain = 65536
