[package]
name = "skif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Embeddable dependency linter for JavaScript and TypeScript monorepos: discover, lint and plan fixes without printing, prompting or writing."
documentation = "https://docs.rs/skif"
keywords = ["monorepo", "linter", "dependencies", "pnpm", "javascript"]
categories = ["development-tools"]
readme = "../../README.md"

[features]
default = ["manifest", "policy"]
# Manifest rules (`skif-rules`).
manifest = ["dep:skif-rules"]
# Version, semver and catalog policies. They ship in the rule providers of `manifest`; the feature name is reserved
# so hosts can already select it.
policy = []
# JavaScript and TypeScript analysis on oxc. Reserved until the analysis crates land; off by default so a host that
# pins its own oxc is never forced onto skif's.
js-analysis = []
# `apply_fixes` and `FixPlan` (format-preserving JSON edits).
fix = ["dep:skif-edit"]
# YAML edits for `pnpm-workspace.yaml`.
yaml-fix = ["fix", "skif-edit/yaml"]
# Human and JSON renderers, re-exported as `skif::render`.
report = ["dep:skif-report"]
# JSON Schema of `skif.toml`, as `skif::config_schema`.
schema = ["skif-config/schema"]

[dependencies]
rayon.workspace = true
serde_json.workspace = true
skif-config.workspace = true
skif-core.workspace = true
skif-edit = { workspace = true, optional = true }
skif-lint.workspace = true
skif-report = { workspace = true, optional = true }
skif-rules = { workspace = true, optional = true }
skif-workspace.workspace = true
thiserror.workspace = true

[[test]]
name = "fix"
required-features = ["fix"]

[lints]
workspace = true
