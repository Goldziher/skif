[package]
name = "skif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Embeddable facade for skif: discover a JS/TS workspace, lint it and plan fixes without IO side effects."
documentation = "https://docs.rs/skif"
keywords = ["linter", "monorepo", "package-json", "dependencies", "pnpm"]
categories = ["development-tools"]
readme = "README.md"
include = ["src/**", "benches/**", "tests/**", "Cargo.toml", "LICENSE", "ATTRIBUTIONS.md", "README.md"]

[features]
default = ["manifest", "policy"]
# Manifest rules (`skif-rules`).
manifest = ["dep:skif-rules"]
# Version, semver and catalog policies. They ship in the rule providers of `manifest`; the feature name is reserved
# so hosts can already select it.
policy = []
# JavaScript and TypeScript analysis on oxc (`skif-js` and the plugin table). Off by default so a host that pins its
# own oxc is never forced onto skif's.
js-analysis = ["dep:skif-js", "dep:skif-js-plugins", "dep:indexmap"]
# `apply_fixes` and `FixPlan` (format-preserving JSON edits).
fix = ["dep:skif-edit"]
# YAML edits for `pnpm-workspace.yaml`.
yaml-fix = ["fix", "skif-edit/yaml"]
# Human, JSON, SARIF and GitHub renderers, re-exported as `skif::render`.
report = ["dep:skif-report"]
# JSON Schema of `skif.toml`, as `skif::config_schema`.
schema = ["skif-config/schema"]

[dependencies]
indexmap = { workspace = true, optional = true }
rayon.workspace = true
serde_json.workspace = true
skif-config.workspace = true
skif-core.workspace = true
skif-edit = { workspace = true, optional = true }
skif-js = { workspace = true, optional = true }
skif-js-plugins = { workspace = true, optional = true }
skif-lint.workspace = true
skif-report = { workspace = true, optional = true }
skif-rules = { workspace = true, optional = true }
skif-workspace.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
serde-saphyr.workspace = true
skif-bench.workspace = true
skif-rules.workspace = true
toml.workspace = true

[[test]]
name = "fix"
required-features = ["fix"]

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "fix"
harness = false
required-features = ["fix"]

[[test]]
name = "js"
required-features = ["js-analysis"]

[[test]]
name = "threads"
required-features = ["js-analysis"]

[[test]]
name = "docs"
required-features = ["js-analysis"]

# The fixtures edit `pnpm-workspace.yaml` catalogs as well as manifests.
[[test]]
name = "policy_conformance"
required-features = ["yaml-fix"]

[lints]
workspace = true
