[package]
name = "skif-specifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "npm dependency specifier parsing and comparison for skif (vendored from syncpack)."
documentation = "https://docs.rs/skif-specifier"
keywords = ["npm", "semver", "specifier", "monorepo"]
categories = ["parser-implementations"]

[lib]
name = "skif_specifier"

[dependencies]
nodejs-semver = "7.0.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "specifier_parsing"
harness = false

[lints]
workspace = true
