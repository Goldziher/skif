[package]
name = "skif-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "skif.toml model, loading, CLI overrides and JSON Schema for skif."
documentation = "https://docs.rs/skif-config"
keywords = ["linter", "configuration", "toml", "monorepo", "skif"]
categories = ["development-tools", "config"]
readme = "README.md"
include = ["/src/**", "/tests/**", "/fixtures/**", "/Cargo.toml", "/LICENSE", "/ATTRIBUTIONS.md", "/README.md"]

# docs.rs builds with every feature so the JSON Schema half of the crate is documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
schema = ["dep:schemars", "dep:serde_json", "skif-core/schema"]

[dependencies]
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
skif-core.workspace = true
skif-specifier.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
