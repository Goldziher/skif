[package]
name = "skif-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Human and JSON renderers for skif reports."
documentation = "https://docs.rs/skif-report"
keywords = ["monorepo", "linter", "dependencies", "diagnostics"]
categories = ["development-tools"]
readme = "README.md"
include = ["src/**/*", "README.md", "Cargo.toml"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skif-core = { path = "../skif-core", version = "0.0.0" }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }

[lints]
workspace = true
