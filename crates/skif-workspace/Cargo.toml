[package]
name = "skif-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Workspace discovery for npm, pnpm, yarn and bun: packages, manifests and catalogs, for skif."
documentation = "https://docs.rs/skif-workspace"
keywords = ["monorepo", "workspace", "pnpm", "package-json", "skif"]
categories = ["development-tools"]
readme = "README.md"
include = [
  "/src/**",
  "/benches/**",
  "/tests/**",
  "/fixtures/**",
  "/Cargo.toml",
  "/LICENSE",
  "/ATTRIBUTIONS.md",
  "/README.md",
]

[dependencies]
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
jsonc-parser = { workspace = true, features = ["serde"] }
rayon.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
skif-config.workspace = true
skif-core.workspace = true
skif-specifier.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "discover"
harness = false

[lints]
workspace = true
