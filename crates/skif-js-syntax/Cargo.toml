[package]
name = "skif-js-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "JavaScript and TypeScript module facts and static config extraction for skif, built on oxc."
documentation = "https://docs.rs/skif-js-syntax"
keywords = ["javascript", "typescript", "oxc", "imports", "exports"]
categories = ["development-tools", "parser-implementations"]
readme = "README.md"

[dependencies]
# Pinned exactly (ADR 0010); the workspace moves these to [workspace.dependencies].
oxc_allocator = "=0.156.0"
oxc_ast = "=0.156.0"
oxc_ast_visit = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_semantic = "=0.156.0"
oxc_span = "=0.156.0"
serde = { version = "1", features = ["derive"] }
skif-core = { path = "../skif-core", version = "0.0.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
