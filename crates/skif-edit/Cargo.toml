[package]
name = "skif-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Format-preserving JSON and YAML edits used by skif autofixes."
documentation = "https://docs.rs/skif-edit"
keywords = ["json", "yaml", "edit", "format-preserving", "skif"]
categories = ["development-tools", "text-processing"]
readme = "README.md"
include = ["/src/**", "/benches/**", "/tests/**", "/Cargo.toml", "/LICENSE", "/ATTRIBUTIONS.md", "/README.md"]

[features]
default = []
yaml = ["dep:yamlpatch", "dep:yamlpath", "dep:yaml_serde"]

[dependencies]
jsonc-parser.workspace = true
serde_json.workspace = true
skif-core.workspace = true
thiserror.workspace = true
yaml_serde = { workspace = true, optional = true }
yamlpatch = { workspace = true, optional = true }
yamlpath = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "json_edit"
harness = false

[lints]
workspace = true
