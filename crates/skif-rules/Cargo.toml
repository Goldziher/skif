[package]
name = "skif-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Built-in manifest and workspace rules for skif."
documentation = "https://docs.rs/skif-rules"
keywords = ["linter", "monorepo", "package-json", "rules", "skif"]
categories = ["development-tools"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/ATTRIBUTIONS.md", "/README.md"]

[dependencies]
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
skif-config.workspace = true
skif-core.workspace = true
skif-lint.workspace = true
skif-specifier.workspace = true
skif-workspace.workspace = true
toml.workspace = true

[dev-dependencies]
insta.workspace = true
skif-edit = { workspace = true, features = ["yaml"] }

[lints]
workspace = true
