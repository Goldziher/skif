[package]
name = "skif-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for skif, the fast dependency linter for JavaScript and TypeScript monorepos."
documentation = "https://docs.rs/skif-cli"
keywords = ["monorepo", "linter", "dependencies", "pnpm", "javascript"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/skif-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "skif"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
detect-indent.workspace = true
detect-newline-style.workspace = true
indexmap.workspace = true
inquire.workspace = true
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true

[dev-dependencies]
debugless-unwrap.workspace = true
insta.workspace = true

[lints]
workspace = true
