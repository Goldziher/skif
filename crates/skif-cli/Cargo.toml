[package]
name = "skif-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for skif, a dependency and package-manager linter for JS/TS monorepos."
documentation = "https://docs.rs/skif-cli"
keywords = ["linter", "monorepo", "package-json", "pnpm", "cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE", "ATTRIBUTIONS.md", "README.md"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/skif-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "skif_cli"
path = "src/lib.rs"

[[bin]]
name = "skif"
path = "src/main.rs"

[dependencies]
clap.workspace = true
inquire.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
skif-core.workspace = true
skif-migrate.workspace = true
skif-report.workspace = true
skif = { workspace = true, features = ["manifest", "js-analysis", "fix", "yaml-fix", "report", "schema"] }
toml.workspace = true
which.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
