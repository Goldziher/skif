[package]
name = "skif-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for skif, a dependency and package-manager linter for JS/TS monorepos."
documentation = "https://docs.rs/skif-cli"
keywords = ["linter","monorepo","package-json","pnpm","cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/skif-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "skif"
path = "src/main.rs"

[dependencies]
clap.workspace = true
inquire.workspace = true
serde.workspace = true
serde_json.workspace = true
skif = { workspace = true, features = ["manifest", "policy", "js-analysis", "fix", "yaml-fix", "report", "schema"] }
which.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
