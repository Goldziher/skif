[package]
name = "skif-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for skif, a dependency and package-manager linter for JS/TS monorepos."
documentation = "https://docs.rs/skif-cli"
keywords = ["linter", "monorepo", "package-json", "pnpm", "cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/LICENSE", "/ATTRIBUTIONS.md", "/README.md"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/skif-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-binstall selects an archive by target triple and cannot see the host's glibc, while the `-gnu` archives need
# glibc 2.34. The statically linked musl archives run on any Linux, so the Linux gnu triples take them.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/skif-x86_64-unknown-linux-musl{ archive-suffix }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/skif-aarch64-unknown-linux-musl{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "skif_cli"
path = "src/lib.rs"

[[bin]]
name = "skif"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ignore.workspace = true
inquire.workspace = true
rayon.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
skif = { workspace = true, features = ["manifest", "js-analysis", "fix", "yaml-fix", "report", "schema", "update"] }
skif-core.workspace = true
skif-migrate.workspace = true
skif-report.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true
which.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
