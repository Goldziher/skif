[package]
name = "skif-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Rule engine for skif: registry, emitter and parallel runner."
documentation = "https://docs.rs/skif-lint"
keywords = ["monorepo", "linter", "dependencies", "rules"]
categories = ["development-tools"]

[dependencies]
rayon = "1.11"
skif-config = { path = "../skif-config", version = "0.0.0" }
skif-core = { path = "../skif-core", version = "0.0.0" }
skif-workspace = { path = "../skif-workspace", version = "0.0.0" }
thiserror = "2.0.21"

[lints]
workspace = true
