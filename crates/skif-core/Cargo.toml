[package]
name = "skif-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Diagnostic, fix, report and filesystem types shared by the skif crates."
documentation = "https://docs.rs/skif-core"
keywords = ["linter", "diagnostics", "monorepo", "package-json", "skif"]
categories = ["development-tools"]
readme = "README.md"
include = ["src/**", "benches/**", "Cargo.toml", "LICENSE", "ATTRIBUTIONS.md", "README.md"]

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
