[package]
name = "skif-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "JavaScript and TypeScript module graph and dependency rules for skif, built on oxc."
documentation = "https://docs.rs/skif-js"
keywords = ["javascript", "typescript", "unused", "dependencies", "monorepo"]
readme = "README.md"
include = ["/src/**", "/benches/**", "/tests/**", "/Cargo.toml", "/LICENSE", "/ATTRIBUTIONS.md", "/README.md"]
categories = ["development-tools"]

[features]
# Typed facts from the TypeScript checker of tsrs (`skif-js-types`, ADR 0034).
type-aware = ["dep:skif-js-types"]
# Plain pointers in tsrs instead of its fixed address-space reservation (ADR 0034); only has an effect with
# `type-aware`.
plain-ptrs = ["skif-js-types?/plain-ptrs"]

[dependencies]
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
oxc_resolver.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
skif-config.workspace = true
skif-core.workspace = true
skif-js-plugins.workspace = true
skif-js-syntax.workspace = true
skif-js-types = { workspace = true, optional = true }
skif-lint.workspace = true
skif-specifier.workspace = true
skif-workspace.workspace = true
toml.workspace = true

[dev-dependencies]
criterion.workspace = true
insta = { workspace = true, features = ["json"] }
tempfile.workspace = true

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "disk_tree"
harness = false

[lints]
workspace = true
