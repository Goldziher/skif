name: skif dependency linter
description: >-
  Lint the dependencies of a JavaScript or TypeScript monorepo: workspace rules and version and catalog
  policies.
author: polylint
branding:
  icon: package
  color: orange

inputs:
  version:
    description: >-
      skif version to install, with or without a leading `v` (e.g. "0.1.0"). Defaults to the version
      this release of the action was published with, whatever ref (tag, floating tag or commit SHA) it is
      used by. A development checkout of the action, which carries no version, falls back to the tag it
      is pinned to (a full release or a floating tag such as `v0.1`) and then to the latest GitHub release.
    required: false
    default: ""
  verify-attestation:
    description: >-
      Verify the release archive's build provenance with `gh attestation verify` after the checksum
      check. Skipped with a warning when the installed `gh` has no `attestation` command. Set to
      "false" for a mirror whose archives carry no attestation.
    required: false
    default: "true"
  args:
    description: >-
      Arguments to pass to skif. A single line is split on spaces (e.g. "--format sarif --output
      skif.sarif"); several lines are one argument per line, so an argument may contain spaces. Ignored
      when install-only is true.
    required: false
    default: ""
  working-directory:
    description: Directory to run skif in.
    required: false
    default: "."
  fail-on-warnings:
    description: >-
      Exit non-zero when skif reports any warning (adds `--fail-on-warnings` to a lint run; not added
      when `args` starts with a skif subcommand such as `baseline` or `migrate`).
    required: false
    default: "false"
  from-sherif:
    description: >-
      Migration aid, off by default. "true": when no skif.toml or .skif.toml is found and the root
      package.json has a `sherif` key or a script that runs sherif, translate those settings with
      `skif migrate --from sherif --profile full` into a temporary file and lint with it (`--config`), so a
      job that replaced sherif keeps its flags until skif.toml is committed. `baseline write`, `prune` and `check`
      read it through a temporary file that extends the translation and then the baseline file. Not done for other
      skif subcommands or when `args` has `--config` or `--no-config`. The skif binary itself never reads sherif
      configuration (ADR 0003).
    required: false
    default: "false"
  install-only:
    description: Install skif and put it on PATH, but do not run it.
    required: false
    default: "false"
  cache:
    description: >-
      Keep skif's cache store between runs: "true" (default) restores it before skif runs and saves it afterwards
      (see cache-save); "false" runs skif without a cache. The store lives in `skif-cache` below the runner's temporary directory, which
      the run is given as `SKIF_CACHE_DIR`. The cache never changes the report or the exit code.
    required: false
    default: "true"
  cache-key:
    description: >-
      A suffix for the cache key, for jobs that would otherwise share one: a matrix job passes what tells its legs
      apart (e.g. the Node version of the leg).
    required: false
    default: ""
  cache-max-size:
    description: >-
      The most the cache may hold, in bytes or with a unit such as "256MiB" (the run's `SKIF_CACHE_MAX_SIZE`).
    required: false
    default: "256MiB"
  cache-save:
    description: >-
      Save the cache after the run: "true" or "false". Empty (default): save only a `push` or `schedule` run of the
      default branch, so a run started by a comment, a dispatch or another workflow restores only. A pull request
      never saves, whatever this says, so it cannot write a cache the default branch reads.
    required: false
    default: ""
  token:
    description: >-
      Token used to query the GitHub API and download release assets. Defaults to the workflow's
      GITHUB_TOKEN, which is enough for a public repository.
    required: false
    default: ${{ github.token }}
  repository:
    description: "Advanced: override the owner/repo release assets are downloaded from."
    required: false
    default: "polylint/skif"

outputs:
  version:
    description: The skif version that was installed (without the leading v).
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed skif binary.
    value: ${{ steps.install.outputs.path }}
  cache-hit:
    description: >-
      "true" when a cache saved for this exact commit was restored; "false" when an older one or none was. Empty
      when the cache is off.
    value: ${{ steps.store.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve version and release asset
      id: resolve
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        # Written by scripts/release-bump.sh; 0.0.0 in a development checkout.
        BAKED_VERSION: "0.9.0"
      run: bash "$ACTION_PATH/scripts/gh-action-resolve.sh"

    # The cache holds the verified archive next to the binary, so a cache hit can be checked against the release's
    # checksums again instead of being trusted.
    - name: Cache skif binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.resolve.outputs.cache-dir }}
        key: skif-v2-${{ steps.resolve.outputs.tag }}-${{ steps.resolve.outputs.asset }}

    - name: Install skif
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        REPO: ${{ steps.resolve.outputs.repo }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        EXT: ${{ steps.resolve.outputs.ext }}
        CHECKSUMS: ${{ steps.resolve.outputs.checksums }}
        BIN_DIR: ${{ steps.resolve.outputs.bin-dir }}
        ARCHIVE_DIR: ${{ steps.resolve.outputs.archive-dir }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$ACTION_PATH/scripts/gh-action-install.sh"

    # skif's cache store (ADR 0007, ADR 0015). The key ends in the commit, so every default-branch run saves a store
    # of its own and a later run restores the nearest one: same inputs first, then any for this job.
    - name: Restore the skif cache
      id: store
      if: inputs.cache == 'true' && inputs.install-only != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/skif-cache
        key: skif-${{ runner.os }}-${{ steps.install.outputs.version }}-${{ github.job }}${{ inputs.cache-key }}-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/skif.toml', '**/.skif.toml', '**/tsconfig*.json', '!**/node_modules/**') }}-${{ github.sha }}
        restore-keys: |
          skif-${{ runner.os }}-${{ steps.install.outputs.version }}-${{ github.job }}${{ inputs.cache-key }}-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/skif.toml', '**/.skif.toml', '**/tsconfig*.json', '!**/node_modules/**') }}-
          skif-${{ runner.os }}-${{ steps.install.outputs.version }}-${{ github.job }}${{ inputs.cache-key }}-

    - name: Run skif
      if: inputs.install-only != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ARGS: ${{ inputs.args }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        FROM_SHERIF: ${{ inputs.from-sherif }}
        # An explicit location, so the run writes the store although `CI` is set. Empty values are unset to skif.
        SKIF_CACHE: ${{ inputs.cache != 'true' && '0' || '' }}
        SKIF_CACHE_DIR: ${{ inputs.cache == 'true' && format('{0}/skif-cache', runner.temp) || '' }}
        SKIF_CACHE_MAX_SIZE: ${{ inputs.cache == 'true' && inputs.cache-max-size || '' }}
      run: bash "$ACTION_PATH/scripts/gh-action-run.sh"

    # A pull request restores only: the store's envelope checks integrity, not who wrote it. Unless `cache-save` says
    # otherwise, only a `push` or `schedule` run of the default branch saves (scripts/test-action-cache.mjs).
    - name: Save the skif cache
      if: >-
        always() && inputs.cache == 'true' && inputs.install-only != 'true'
        && steps.store.outputs.cache-primary-key != '' && steps.store.outputs.cache-hit != 'true'
        && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        && (inputs.cache-save == 'true' || (inputs.cache-save == ''
        && (github.event_name == 'push' || github.event_name == 'schedule')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/skif-cache
        key: ${{ steps.store.outputs.cache-primary-key }}
