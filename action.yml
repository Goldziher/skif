name: skif dependency linter
description: >-
  Lint the dependencies of a JavaScript or TypeScript monorepo: workspace rules and version and catalog
  policies.
author: Goldziher
branding:
  icon: package
  color: orange

inputs:
  version:
    description: >-
      skif version to install, with or without a leading `v` (e.g. "0.1.0"). Defaults to the version
      this release of the action was published with, whatever ref (tag, floating tag or commit SHA) it is
      used by. A development checkout of the action, which carries no version, falls back to the tag it
      is pinned to (a full release or a floating tag such as `v0.1`) and then to the latest GitHub release.
    required: false
    default: ""
  verify-attestation:
    description: >-
      Verify the release archive's build provenance with `gh attestation verify` after the checksum
      check. Skipped with a warning when the installed `gh` has no `attestation` command. Set to
      "false" for a mirror whose archives carry no attestation.
    required: false
    default: "true"
  args:
    description: >-
      Arguments to pass to skif. A single line is split on spaces (e.g. "--format sarif --output
      skif.sarif"); several lines are one argument per line, so an argument may contain spaces. Ignored
      when install-only is true.
    required: false
    default: ""
  working-directory:
    description: Directory to run skif in.
    required: false
    default: "."
  fail-on-warnings:
    description: >-
      Exit non-zero when skif reports any warning (adds `--fail-on-warnings` to a lint run; not added
      when `args` starts with a skif subcommand such as `baseline` or `migrate`).
    required: false
    default: "false"
  from-sherif:
    description: >-
      Migration aid, off by default. "true": when no skif.toml or .skif.toml is found and the root
      package.json has a `sherif` key or a script that runs sherif, translate those settings with
      `skif migrate --from sherif --profile full` into a temporary file and lint with it (`--config`), so a
      job that replaced sherif keeps its flags until skif.toml is committed. `baseline write`, `prune` and `check`
      read it through a temporary file that extends the translation and then the baseline file. Not done for other
      skif subcommands or when `args` has `--config` or `--no-config`. The skif binary itself never reads sherif
      configuration (ADR 0025).
    required: false
    default: "false"
  install-only:
    description: Install skif and put it on PATH, but do not run it.
    required: false
    default: "false"
  token:
    description: >-
      Token used to query the GitHub API and download release assets. Defaults to the workflow's
      GITHUB_TOKEN, which is enough for a public repository.
    required: false
    default: ${{ github.token }}
  repository:
    description: "Advanced: override the owner/repo release assets are downloaded from."
    required: false
    default: "Goldziher/skif"

outputs:
  version:
    description: The skif version that was installed (without the leading v).
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed skif binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - name: Resolve version and release asset
      id: resolve
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        # Written by scripts/release-bump.sh; 0.0.0 in a development checkout.
        BAKED_VERSION: "0.5.0"
      run: bash "$ACTION_PATH/scripts/gh-action-resolve.sh"

    # The cache holds the verified archive next to the binary, so a cache hit can be checked against the release's
    # checksums again instead of being trusted.
    - name: Cache skif binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.resolve.outputs.cache-dir }}
        key: skif-v2-${{ steps.resolve.outputs.tag }}-${{ steps.resolve.outputs.asset }}

    - name: Install skif
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        REPO: ${{ steps.resolve.outputs.repo }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        EXT: ${{ steps.resolve.outputs.ext }}
        CHECKSUMS: ${{ steps.resolve.outputs.checksums }}
        BIN_DIR: ${{ steps.resolve.outputs.bin-dir }}
        ARCHIVE_DIR: ${{ steps.resolve.outputs.archive-dir }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$ACTION_PATH/scripts/gh-action-install.sh"

    - name: Run skif
      if: inputs.install-only != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ARGS: ${{ inputs.args }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        FROM_SHERIF: ${{ inputs.from-sherif }}
      run: bash "$ACTION_PATH/scripts/gh-action-run.sh"
