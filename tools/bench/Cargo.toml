[package]
name = "skif-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Benchmark harness for skif: synthetic monorepo generator (also a library for in-process benches), pinned corpus and hyperfine runner."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "skif-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
skif-workspace.workspace = true
toml.workspace = true

[dev-dependencies]
# The dead-code test runs skif in process on a `MemoryFs`, so it needs no built binary, network or Node.
skif = { workspace = true, features = ["js-analysis"] }

[lints]
workspace = true
