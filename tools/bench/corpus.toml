# Pinned benchmark and parity corpus: real repositories at fixed commits, so results are comparable between runs
# and machines. Fetch with `skif-bench corpus fetch` (or `mise run corpus:fetch`).
#
# Per repository:
#   rev              full commit SHA (branches and tags are rejected)
#   package-manager  pnpm, yarn, npm, bun or rush; selects the install command of `parity --install`
#   suites           bench = timed by `skif-bench run`; parity = compared with knip and syncpack
#   sparse           optional list of directories; when set only these (plus root files) are checked out
#   install          false when the dependencies cannot be installed (the reason is in `notes`); compared uninstalled
#   install-command  optional install command (program first) replacing the package manager's default
#   install-timeout-secs  optional install time limit, replacing the global --timeout-secs for the install only
#   build-command    optional command (program first) run after the install, building packages the configs load
#   build-timeout-secs  optional build-command time limit, the install's when unset
#   recursive        true when skif must run with --recursive here (nested roots that are not workspace members)
#   knip-unread      path prefixes knip does not read here; one-sided findings below them are a known deviation
#   entry            entry files of the root workspace neither tool finds (globs); both get them besides their defaults
#   bench-knip-args  extra knip arguments when `skif-bench run` times it here, so it reads the files skif reads
#   bench-knip-failure  { matches, reason }: knip is known to exit with an error here (bench suite only). A timed knip
#                    run whose error output holds `matches` is published as failing with `reason` (Markdown prose),
#                    not timed against skif; an error without that text, or a clean run, makes the check invalid
#   knip-invalid     why knip's report here is not a valid comparison; the repository is compared and its row marked
#   knip-root        "rush": while knip runs, the checkout gets a root package.json whose workspaces come from rush.json
#   notes            why the repository is in the corpus and what to expect from it

# The comparison tools, declared in this one place: parity, syncpack-diff and deadcode run them through npx, and
# `skif-bench run` installs them with `npm ci` from tools/package.json and tools/package-lock.json, which repeat these
# versions and lock their dependencies, into a scratch prefix and times their executables. Each is an exact version; a
# range or a dist-tag is rejected, and so is a lock whose tool versions differ from these (to bump one, change it here
# and in tools/package.json, then run `npm install --package-lock-only --ignore-scripts` in tools/).
[tools]
knip = "6.44.1"
syncpack = "15.3.3"
sherif = "1.13.0"

[[repo]]
name = "create-t3-turbo"
url = "https://github.com/t3-oss/create-t3-turbo.git"
rev = "8f945b7bb3bfb3ca8358d48b1ff0214079bc11ee"
package-manager = "pnpm"
suites = ["bench", "parity"]
bench-knip-failure = { matches = "Cannot find module 'metro-cache'", reason = "its Expo Metro config needs metro-cache, which pnpm's strict install does not provide" }
notes = "Small pnpm monorepo with a catalog. Even installed, knip exits with an error here: apps/expo/metro.config.js requires metro-cache, which is not listed, and packages/db/drizzle.config.ts throws without POSTGRES_URL. knip still prints its report; parity records the two files and counts knip-only findings in those packages as knip-config-error."

[[repo]]
name = "vue-core"
url = "https://github.com/vuejs/core.git"
rev = "24c9d0bffb2299635b8112a978d74a38723aaa10"
package-manager = "pnpm"
suites = ["bench", "parity"]
bench-knip-failure = { matches = "sfc-playground/vite.config.ts (__DEV__ is not defined)", reason = "its SFC playground Vite config reads a build-time global that only the repository's own build defines" }
notes = "TypeScript library monorepo."

[[repo]]
name = "tanstack-query"
url = "https://github.com/TanStack/query.git"
rev = "73c5686de77b3d6767e853d2d623453c477d3b88"
package-manager = "pnpm"
suites = ["bench", "parity"]
notes = "Many framework packages and examples."

[[repo]]
name = "babel"
url = "https://github.com/babel/babel.git"
rev = "7750b3d6912344e8a621a99a393cc2f5d3f4d2db"
package-manager = "yarn"
suites = ["bench", "parity"]
recursive = true
notes = "Large yarn monorepo. scripts/repo-utils (linked from the root as `$repo-utils`) and scripts/integration-tests/fixtures/nextjs-10 are standalone projects outside the workspace patterns (nested roots), so skif runs recursively to read the files knip reads from the root."

[[repo]]
name = "npm-cli"
url = "https://github.com/npm/cli.git"
rev = "fc517df18fb59a33b39d383c6766690bc427ac06"
package-manager = "npm"
suites = ["bench", "parity"]
knip-unread = ["docs/", "mock-globals/", "mock-registry/", "smoke-tests/", "workspaces/"]
# npm 10 rejects this lockfile (`npm ci` exits with EUSAGE); npm 11 accepts it.
install-command = ["npx", "--yes", "npm@11.6.2", "ci", "--ignore-scripts"]
# The timed knip run reads the workspaces too, as skif does; parity keeps knip's default and the knip-unread deviation.
bench-knip-args = ["--no-gitignore"]
notes = "npm workspaces. A deny-all root .gitignore re-includes these directories one by one; knip reads none of their files unless run with --no-gitignore."

[[repo]]
name = "angular"
url = "https://github.com/angular/angular.git"
rev = "37563fc32267fd0fcbdff8caf98862962e5d46b5"
package-manager = "pnpm"
suites = ["parity"]
# Not recursive: the nested projects knip reads (packages/compiler-cli/preprocessor, integration/*) lie inside workspace
# members, so a recursive run does not lint them as roots either (ADR 0022). It would add at most
# packages/misc/angular-in-memory-web-api and packages/, whose manifest (`{"type": "module"}`) only marks the module
# type and whose files the workspace already reads.
notes = "Bazel-driven pnpm workspace; many integration projects."

[[repo]]
name = "rules-js"
url = "https://github.com/aspect-build/rules_js.git"
rev = "25bca017a89e5f7099b4a5a92ad336c48864523e"
package-manager = "pnpm"
suites = ["parity"]
# The pnpm that MODULE.bazel pins (pnpm_version). pnpm 9 rejects the lockfile's overrides
# (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH); this one accepts it. The install fetches tarballs from codeload.github.com.
install-command = ["npx", "--yes", "pnpm@10.22.0", "install", "--ignore-scripts", "--frozen-lockfile"]
notes = "Many e2e and example roots, some without a root package.json."

[[repo]]
name = "cal-com"
url = "https://github.com/calcom/cal.com.git"
rev = "e8afecd163cd3a0a3ff279bd4721aa7f073c4685"
package-manager = "yarn"
suites = ["parity"]
notes = "Application monorepo with TypeScript path aliases."

[[repo]]
name = "jest"
url = "https://github.com/jestjs/jest.git"
rev = "72614448ecb9d16c58d6474b3091247c14a5c090"
package-manager = "yarn"
suites = ["parity"]
notes = "Yarn workspaces with hundreds of fixture packages."

[[repo]]
name = "mastra"
url = "https://github.com/mastra-ai/mastra.git"
rev = "01524b22db5adb7dfdfe4950190918202338d9bd"
package-manager = "pnpm"
suites = ["parity"]
recursive = true
notes = "Large pnpm workspace with many exports. templates/* and examples/* are standalone projects (nested roots), so skif runs recursively to read the files knip reads from the root."

[[repo]]
name = "rushstack"
url = "https://github.com/microsoft/rushstack.git"
rev = "ca0b960ced9324f65be85800a72184edeb91cc3b"
package-manager = "rush"
suites = ["parity"]
# install-run-rush.js fetches the Rush version rush.json pins and installs every subspace from its lockfile under
# common/config/subspaces; --bypass-policy skips the git email policy, which a CI checkout cannot meet.
install-command = ["node", "common/scripts/install-run-rush.js", "install", "--bypass-policy"]
install-timeout-secs = 3600
knip-root = "rush"
notes = "Rush workspace (rush.json) without a root package.json, for skif and the syncpack diff. knip has no Rush support and needs a root package.json, so while it runs the checkout gets one with the projectFolder of every rush.json project as its workspaces, and knip reads the node_modules the Rush install linked into each project."

[[repo]]
name = "vscode"
url = "https://github.com/microsoft/vscode.git"
rev = "6b7063d8883d0d6af80246f2f79df95cb8251059"
package-manager = "pnpm"
suites = ["parity"]
recursive = true
# The entry points build/next/index.ts bundles for every target (the workbench, workers, shared and utility
# processes); nothing imports them, so without them both tools report the workbench as unused.
entry = [
  "src/vs/code/browser/workbench/workbench.ts",
  "src/vs/code/electron-browser/workbench/workbench.ts",
  "src/vs/code/electron-utility/sharedProcess/sharedProcessMain.ts",
  "src/vs/code/node/cliProcessMain.ts",
  "src/vs/editor/common/services/editorWebWorkerMain.ts",
  "src/vs/platform/agentHost/node/agentHostMain.ts",
  "src/vs/platform/agentHost/node/diffWorkerMain.ts",
  "src/vs/platform/files/node/watcher/watcherMain.ts",
  "src/vs/platform/localTranscription/node/localTranscriptionMain.ts",
  "src/vs/platform/profiling/electron-browser/profileAnalysisWorkerMain.ts",
  "src/vs/platform/terminal/node/ptyHostMain.ts",
  "src/vs/sessions/electron-browser/sessions.ts",
  "src/vs/sessions/sessions.desktop.main.ts",
  "src/vs/sessions/sessions.web.main.internal.ts",
  "src/vs/workbench/api/node/extensionHostProcess.ts",
  "src/vs/workbench/api/worker/extensionHostWorkerMain.ts",
  "src/vs/workbench/contrib/debug/node/telemetryApp.ts",
  "src/vs/workbench/contrib/mediaPreview/browser/imageEncoderWorkerMain.ts",
  "src/vs/workbench/contrib/notebook/common/services/notebookWebWorkerMain.ts",
  "src/vs/workbench/contrib/output/common/outputLinkComputerMain.ts",
  "src/vs/workbench/services/keybinding/browser/keyboardLayouts/layout.contribution.darwin.ts",
  "src/vs/workbench/services/keybinding/browser/keyboardLayouts/layout.contribution.linux.ts",
  "src/vs/workbench/services/keybinding/browser/keyboardLayouts/layout.contribution.win.ts",
  "src/vs/workbench/services/languageDetection/browser/languageDetectionWebWorkerMain.ts",
  "src/vs/workbench/services/search/worker/localFileSearchMain.ts",
  "src/vs/workbench/services/textMate/browser/backgroundTokenization/worker/textMateTokenizationWorker.workerMain.ts",
  "src/vs/workbench/workbench.desktop.main.ts",
  "src/vs/workbench/workbench.web.main.internal.ts",
]
notes = "Very large application tree; extensions/copilot is a nested root with its own workspace."

[[repo]]
name = "n8n"
url = "https://github.com/n8n-io/n8n.git"
rev = "c1420c66253871bacecbe7148754ca050a81e7f2"
package-manager = "pnpm"
suites = ["parity"]
# The tool configurations of the packages import the built dist of these workspace config packages; the install runs
# without scripts, so they are built here, each with the workspace packages it depends on (`...`), in dependency order.
# Then `@n8n/db` generates its gitignored `src/migrations/{sqlite,postgresdb}/index.ts`, which its `src/index.ts`
# imports and which list the migrations; the generator reads only the migration files (no network).
build-command = [
  "sh",
  "-c",
  """pnpm --filter @n8n/oxlint-config... --filter @n8n/vitest-config... --filter @n8n/eslint-config... \
--filter @n8n/stylelint-config... --filter @n8n/constants... run build \
&& pnpm --filter @n8n/db run gen:migration-index""",
]
notes = "Large pnpm workspace with many nodes packages."

[[repo]]
name = "opencode"
url = "https://github.com/sst/opencode.git"
rev = "3ba597f7769e19cc3b5f67e3d6667e7b6318f6a3"
package-manager = "bun"
suites = ["parity"]
# The bun of mise.lock, pinned here so a relock or an ambient bun cannot change what the frozen install resolves.
install-command = ["mise", "x", "bun@1.3.14", "--", "bun", "install", "--ignore-scripts", "--frozen-lockfile"]
notes = "bun workspace."

[[repo]]
