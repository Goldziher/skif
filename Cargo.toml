[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
homepage = "https://github.com/Goldziher/skif"
repository = "https://github.com/Goldziher/skif"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
debugless-unwrap = "1.0.0"
detect-indent = "0.1.0"
detect-newline-style = "1.0.0"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
insta = "1.49.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Error messages quote paths with `{:?}`; snapshots and tests depend on that format.
unnecessary_debug_formatting = "allow"
# The collectors and rule checkers are long linear passes over the workspace.
too_many_lines = "allow"
# Issues are returned boxed as trait objects by design.
unnecessary_box_returns = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Release build with symbols for flamegraphs and profilers: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
