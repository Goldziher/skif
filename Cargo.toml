[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
homepage = "https://github.com/Goldziher/skif"
repository = "https://github.com/Goldziher/skif"

[workspace.dependencies]
# oxc releases break weekly; every oxc crate is pinned exactly and moves in lockstep (ADR 0010).
oxc_allocator = "=0.156.0"
oxc_ast = "=0.156.0"
oxc_ast_visit = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_resolver = "=11.24.3"
oxc_semantic = "=0.156.0"
oxc_span = "=0.156.0"
oxc_str = "=0.156.0"
anyhow = "1.0.104"
assert_cmd = "2.0.17"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
globset = "0.4.21"
ignore = "0.4.23"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
insta = "1.49.0"
jsonc-parser = "0.34.0"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-build = "2"
napi-derive = "3"
nodejs-semver = "7.0.0"
proptest = "1.12.0"
rayon = "1.12.0"
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-width = "0.2.2"
which = "8.0.0"
yaml_serde = "0.10"
yamlpatch = "1.31"
yamlpath = "1.31"

skif = { path = "crates/skif", version = "=0.0.0" }
skif-bench = { path = "tools/bench" }
skif-cli = { path = "crates/skif-cli", version = "=0.0.0" }
skif-config = { path = "crates/skif-config", version = "=0.0.0" }
skif-core = { path = "crates/skif-core", version = "=0.0.0" }
skif-edit = { path = "crates/skif-edit", version = "=0.0.0" }
skif-js = { path = "crates/skif-js", version = "=0.0.0" }
skif-js-plugins = { path = "crates/skif-js-plugins", version = "=0.0.0" }
skif-js-syntax = { path = "crates/skif-js-syntax", version = "=0.0.0" }
skif-lint = { path = "crates/skif-lint", version = "=0.0.0" }
skif-report = { path = "crates/skif-report", version = "=0.0.0" }
skif-rules = { path = "crates/skif-rules", version = "=0.0.0" }
skif-specifier = { path = "crates/skif-specifier", version = "=0.0.0" }
skif-workspace = { path = "crates/skif-workspace", version = "=0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Error messages quote paths with `{:?}`; snapshots and tests depend on that format.
unnecessary_debug_formatting = "allow"
# The collectors and rule checkers are long linear passes over the workspace.
too_many_lines = "allow"
# Issues are returned boxed as trait objects by design.
unnecessary_box_returns = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The npm addon is loaded into the Node process: a panic must unwind to the napi boundary and become a JS
# exception instead of aborting the host. Build it with `napi build --profile node`.
[profile.node]
inherits = "release"
panic = "unwind"

# Release build with symbols for flamegraphs and profilers: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
