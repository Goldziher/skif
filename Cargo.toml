[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
homepage = "https://github.com/Goldziher/skif"
repository = "https://github.com/Goldziher/skif"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
globset = "0.4.21"
ignore = "0.4.34"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
insta = "1.49.0"
jsonc-parser = "0.34.0"
memchr = "2.8.3"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-build = "2"
napi-derive = "3"
nodejs-semver = "7.0.0"
# oxc releases break weekly; every oxc crate is pinned exactly and moves in lockstep (ADR 0010).
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_parser = "0.157.0"
oxc_resolver = "11.24.3"
oxc_semantic = "0.157.0"
oxc_span = "0.157.0"
oxc_str = "0.157.0"
proptest = "1.12.0"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
rustls-native-certs = "0.8.5"
# The crypto provider ureq's rustls uses in `skif update` (ADR 0058); ring, not aws-lc, so no C toolchain is needed.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The module cache key (ADR 0066); already in the tree through phf_shared.
siphasher = "1.0.4"

skif = { path = "crates/skif", version = "=0.2.0" }
skif-bench = { path = "tools/bench" }
skif-cli = { path = "crates/skif-cli", version = "=0.2.0" }
skif-config = { path = "crates/skif-config", version = "=0.2.0" }
skif-core = { path = "crates/skif-core", version = "=0.2.0" }
skif-edit = { path = "crates/skif-edit", version = "=0.2.0" }
skif-js = { path = "crates/skif-js", version = "=0.2.0" }
skif-js-plugins = { path = "crates/skif-js-plugins", version = "=0.2.0" }
skif-js-syntax = { path = "crates/skif-js-syntax", version = "=0.2.0" }
skif-lint = { path = "crates/skif-lint", version = "=0.2.0" }
skif-migrate = { path = "crates/skif-migrate", version = "=0.2.0" }
skif-report = { path = "crates/skif-report", version = "=0.2.0" }
skif-rules = { path = "crates/skif-rules", version = "=0.2.0" }
skif-specifier = { path = "crates/skif-specifier", version = "=0.2.0" }
skif-workspace = { path = "crates/skif-workspace", version = "=0.2.0" }
similar = "3.2.1"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.2.1", features = ["preserve_order"] }
toml_edit = "0.25.19"
unicode-width = "0.2.3"
# `skif update` only (ADR 0058): blocking HTTP with rustls on ring and gzip; roots from the OS store.
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "gzip"] }
which = "8.0.6"
yaml_serde = "0.10"
yamlpatch = "1.32"
yamlpath = "1.32"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Error messages quote paths with `{:?}`; snapshots and tests depend on that format.
unnecessary_debug_formatting = "allow"
# The collectors and rule checkers are long linear passes over the workspace.
too_many_lines = "allow"
# Issues are returned boxed as trait objects by design.
unnecessary_box_returns = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The npm addon is loaded into the Node process: a panic must unwind to the napi boundary and become a JS
# exception instead of aborting the host. Build it with `napi build --profile node`.
[profile.node]
inherits = "release"
panic = "unwind"

# Release build with symbols for flamegraphs and profilers: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
