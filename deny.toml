[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "itertools@0.13.0", reason = "transitive duplicate; waits for upstream to converge on one release" },
  { crate = "syn@2.0.119", reason = "transitive duplicate of syn 3 pulled in by different proc-macro dependencies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
