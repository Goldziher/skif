[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "hashbrown@0.14.5", reason = "transitive duplicate from the oxc stack; waits for upstream to converge" },
  { crate = "hashbrown@0.16.1", reason = "transitive duplicate from oxc_resolver; waits for upstream to converge" },
  { crate = "convert_case@0.10.0", reason = "transitive duplicate via derive_more (crossterm, inquire) next to napi-derive; waits for upstream" },
  { crate = "syn@2.0.119", reason = "transitive duplicate of syn 3 pulled in by different proc-macro dependencies" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17, the rustls crypto provider of `skif update`, is still on windows-sys 0.52" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
